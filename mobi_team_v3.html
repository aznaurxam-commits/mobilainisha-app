case:`<defs><linearGradient id="cs" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2ebe9" stop-opacity=".95"/><stop offset="1" stop-color="#b7c9d0" stop-opacity=".65"/></linearGradient></defs><g transform="rotate(-9 85 65)"><rect x="47" y="4" width="77" height="120" rx="16" fill="url(#cs)" stroke="#8396a5" stroke-width="4"/><rect x="54" y="12" width="31" height="32" rx="10" fill="#f4f7f8" stroke="#859ba6" stroke-width="2"/><circle cx="64" cy="23" r="6" fill="#6e8795"/><circle cx="77" cy="34" r="6" fill="#6e8795"/><path d="M58 97q30 16 56-10" stroke="#fff" stroke-opacity=".7" stroke-width="5" fill="none"/><text x="85" y="72" text-anchor="middle" font-size="10" font-weight="900" fill="#758b9a">M</text></g>`,
powerbank:`<g opacity=".98"><rect x="13" y="16" width="87" height="100" rx="8" fill="#e8f3ef" stroke="#bfd2cb" stroke-width="2"/><rect x="13" y="16" width="87" height="18" rx="8" fill="#d9ece4"/><text x="56" y="29" font-size="6" font-weight="900" text-anchor="middle" fill="#16765a">MOBILAINISHA</text><text x="54" y="104" font-size="7" font-weight="700" text-anchor="middle" fill="#527467">POWERBANK</text></g><rect x="38" y="8" width="88" height="112" rx="14" fill="#1e2840"/><rect x="42" y="12" width="80" height="104" rx="12" fill="#35435a"/><rect x="49" y="23" width="67" height="81" rx="9" fill="#2a354c"/><path d="M56 82q28-25 52-2" stroke="#5ba995" opacity=".38" stroke-width="4" fill="none"/><text x="83" y="53" font-size="10" text-anchor="middle" font-weight="900" fill="#e8edf1">MOBILAINISHA</text><rect x="68" y="66" width="29" height="12" rx="3" fill="none" stroke="#6ee0b5" stroke-width="2"/><rect x="97" y="69" width="3" height="6" fill="#6ee0b5"/><path d="m83 68-5 5h4l-2 4 6-6h-4z" fill="#6ee0b5"/><rect x="71" y="8" width="24" height="4" rx="2" fill="#161d28"/>`,
cable:`<rect x="90" y="12" width="61" height="80" rx="8" fill="#eaf2ef" stroke="#b9d4c9" stroke-width="2"/><text x="120" y="27" font-size="6" font-weight="900" text-anchor="middle" fill="#0b7757">MOBILAINISHA</text><text x="120" y="81" font-size="8" font-weight="700" text-anchor="middle" fill="#387864">USB-C</text><path d="M44 30C-4 52 14 117 65 116c41 0 35-57 70-59" stroke="#29344c" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M44 30C-4 52 14 117 65 116c41 0 35-57 70-59" stroke="#a2b4c4" stroke-width="5" fill="none" stroke-linecap="round"/><g transform="rotate(22 43 25)"><rect x="31" y="11" width="25" height="29" rx="5" fill="#1d2a3e"/><rect x="36" y="2" width="15" height="16" rx="3" fill="#a9b9c2"/><rect x="39" y="5" width="9" height="6" rx="1" fill="#4e616e"/></g><g transform="rotate(-32 138 52)"><rect x="127" y="46" width="24" height="29" rx="5" fill="#1d2a3e"/><rect x="132" y="35" width="14" height="18" rx="3" fill="#a9b9c2"/><rect x="135" y="38" width="8" height="6" rx="1" fill="#506471"/></g><text x="78" y="50" text-anchor="middle" font-size="11" font-weight="900" fill="#087e58">M</text>`,
charger:`<rect x="26" y="30" width="79" height="86" rx="9" fill="#eaf2ef" stroke="#b9d6c9" stroke-width="2"/><text x="65" y="46" font-size="6" font-weight="900" text-anchor="middle" fill="#0b7757">MOBILAINISHA</text><text x="65" y="102" font-size="7" font-weight="700" text-anchor="middle" fill="#54816b">35W · USB-C</text><rect x="56" y="20" width="65" height="92" rx="16" fill="#fff" stroke="#cbd7e3" stroke-width="3"/><path d="M63 31q20-10 42 0" fill="none" stroke="#f4f5f7" stroke-width="7"/><rect x="68" y="52" width="41" height="38" rx="8" fill="#f7f9fa"/><text x="88" y="73" text-anchor="middle" font-size="11" font-weight="900" fill="#197d61">MOBI</text><rect x="72" y="13" width="9" height="19" rx="3" fill="#b8c6cc"/><rect x="95" y="13" width="9" height="19" rx="3" fill="#b8c6cc"/><rect x="76" y="110" width="25" height="4" rx="2" fill="#7e929e"/>`,
earbuds:`<rect x="41" y="60" width="89" height="53" rx="24" fill="#fff" stroke="#d2dbe3" stroke-width="3"/><path d="M43 78q40 18 84-1" fill="none" stroke="#e5ebef" stroke-width="3"/><circle cx="85" cy="94" r="3" fill="#0b9267"/><g fill="#f8fafb" stroke="#bdcad5" stroke-width="3"><path d="M64 13q14-3 17 8v25q-5 11-13 0V33q-11-1-10-10c0-5 2-8 6-10Z"/><path d="M104 13q-14-3-17 8v25q5 11 13 0V33q11-1 10-10c0-5-2-8-6-10Z"/></g>`,
glass:`<g transform="rotate(-10 85 65)"><rect x="55" y="4" width="73" height="117" rx="13" fill="#c9dae5" opacity=".48" stroke="#7795a5" stroke-width="3"/><rect x="47" y="10" width="70" height="117" rx="13" fill="#f9fcfd" opacity=".42" stroke="#94b2c0" stroke-width="3"/><path d="m55 100 55-68" stroke="#fff" stroke-width="8" opacity=".6"/><path d="m50 117 65-79" stroke="#6bc3ae" stroke-width="2" opacity=".65"/></g>`,
repair:`<g><rect x="42" y="11" width="58" height="105" rx="12" fill="#293449"/><rect x="46" y="16" width="50" height="95" rx="9" fill="#e3edf3"/><path d="m71 49 7 12-10 10" stroke="#5ba48b" stroke-width="4" fill="none"/><g transform="rotate(-35 122 75)"><rect x="114" y="46" width="13" height="66" rx="5" fill="#777ca3"/><path d="M114 50h13l5-15-12-10-11 11Z" fill="#c6ccdb"/><path d="M116 92h9" stroke="#e5e8f1" stroke-width="4"/></g></g>`};
return `<svg ${base} xmlns="http://www.w3.org/2000/svg">${G[type]||G.phone}</svg>`;
}
function product(id){return GOODS.find(p=>p.id===id)}
function catTile(type){const [title,hint]=PRODUCT_TYPES[type];return `<button type="button" class="category-card c-${type} ${st.category===type?'selected':''}" data-action="cat" data-type="${type}"><div class="category-art">${art(type)}</div><div class="category-copy"><b>${title}</b><span>${hint}</span></div></button>`}
function pickCategory(type){if(type==='repair')jump('repair');else jump('catalog',{category:type,brand:'Все',segment:'Все',search:''})}
function listing(cat=st.category){let l=GOODS.filter(p=>cat==='all'||p.cat===cat);if(st.brand!=='Все')l=l.filter(p=>p.brand===st.brand);if(st.segment!=='Все')l=l.filter(p=>p.note===st.segment);if(st.search.trim())l=l.filter(p=>(p.name+' '+p.brand+' '+p.note).toLocaleLowerCase('ru').includes(st.search.toLocaleLowerCase('ru')));return l}
function cardProduct(p){const isFav=D.favorites.includes(p.id);return `<article class="product-card"><div class="product-art">${art(p.cat)}<span class="pill-demo">ОБРАЗЕЦ</span></div><div class="product-copy"><div class="maker">${esc(p.brand)}</div><h3>${esc(p.name)}</h3><div class="small">${esc(p.note)}</div><div class="price">${fmt(p.price)}<small>Примерная цена · демо</small></div><div class="row"><button class="link" data-action="fav" data-id="${p.id}" aria-label="Добавить в избранное">${isFav?'♥ В избранном':'♡ В избранное'}</button></div><button class="buy" data-action="add" data-id="${p.id}">+ В корзину</button></div></article>`}
function storeStrip(){return `<div class="store-banner"><div><b>📍 ${esc(storeName(st.shop))}</b><small>Выбранный магазин · наличие демонстрационное</small></div><button data-action="stores">Сменить</button></div>`}
function homeView(){return `<div class="hi">Электроника рядом с тобой</div><h1 class="h1">Техника, которую легко выбрать</h1>${storeStrip()}<section class="hero"><span class="eyebrow">MOBILAINISHA · СОЧИ</span><h2>Всё для твоего смартфона</h2><p>Телефоны, аксессуары и ремонт — в одном приложении.</p><button data-action="catalog">Перейти в каталог →</button><div class="hero-art">${art('phone')}</div></section><div class="section-head"><h2>Что ищешь?</h2><button data-action="catalog">Все категории →</button></div><div class="category-grid">${TYPE_ORDER.map(catTile).join('')}</div><div class="section-head"><h2>Подборка товаров</h2><span class="minor">Примеры для макета</span></div><div class="product-grid">${GOODS.slice(0,4).map(cardProduct).join('')}</div><div class="section-head"><h2>Наши магазины</h2><button data-action="stores">Посмотреть все →</button></div><div class="panel"><div class="panel-row"><div class="store-ico">${icon('stores')}</div><div class="copy"><h3>4 магазина в Сочи</h3><p>Хоста, Кудепста, Блиново, Чайсовхоз. Выбирай точку самовывоза и ремонта.</p></div><button class="link" data-action="stores">Открыть →</button></div></div>`}
function catalogView(){const names=['Все',...new Set(GOODS.filter(x=>st.category==='all'||x.cat===st.category).map(x=>x.brand))];const segments=st.category==='phone'?['Все','Флагманы','Средний класс']:[];const selected=st.category==='all'?'Каталог':PRODUCT_TYPES[st.category]?.[0]||'Каталог';return `<div class="hi">Покупателям</div><h1 class="h1">${selected}</h1><p class="lead">Выбирай категорию, бренд и товар. Все цены и товары здесь пока показаны как пример.</p>${storeStrip()}<div class="search">${icon('catalog',18)}<input id="productSearch" placeholder="Найти товар или бренд" value="${esc(st.search)}" aria-label="Поиск товаров" autocomplete="off"></div><div class="chiprow">${['all',...TYPE_ORDER.filter(x=>x!=='repair')].map(c=>`<button class="chip ${st.category===c?'active':''}" data-action="cat" data-type="${c}">${c==='all'?'Все товары':PRODUCT_TYPES[c][0]}</button>`).join('')}</div>${st.category==='all'?`<div class="category-grid">${TYPE_ORDER.map(catTile).join('')}</div>`:''}<div class="section-head"><h2>Бренды</h2><span class="minor">По выбранному разделу</span></div><div class="chiprow">${names.map(b=>`<button class="chip ${st.brand===b?'active':''}" data-action="brand" data-name="${esc(b)}">${esc(b)}</button>`).join('')}</div>${segments.length?`<div class="chiprow">${segments.map(b=>`<button class="chip ${st.segment===b?'active':''}" data-action="segment" data-name="${esc(b)}">${esc(b)}</button>`).join('')}</div>`:''}<div class="section-head"><h2>Товары</h2><span class="minor" id="foundCount">${listing().length} позиции</span></div><div class="product-grid" id="productGrid">${listing().map(cardProduct).join('')||empty('Ничего не найдено','Поменяй фильтры или поисковый запрос.')}</div>`}
function storesView(){return `<div class="hi">MOBILAINISHA · СОЧИ</div><h1 class="h1">Выбери магазин</h1><p class="lead">Выбранная точка используется для просмотра каталога, будущего самовывоза и приёма в ремонт. Служебные данные сотрудников покупателю недоступны.</p><div class="store-grid">${STORE.map((n,i)=>`<button class="store-card ${st.shop===i?'selected':''}" data-action="store" data-shop="${i}"><span class="store-ico">${icon('stores',23)}</span><b>${esc(n)}</b><small>Сочи · адрес добавим позже</small><span class="tick">${st.shop===i?'✓ Сейчас выбран':'Выбрать точку →'}</span></button>`).join('')}</div><div class="panel"><h3>Что будет видеть покупатель?</h3><p>Адрес, часы работы и контакт магазина (после добавления), доступность товара, возможность самовывоза и приёма в ремонт. Внутренний учёт и панель сотрудников здесь не показываются.</p></div>`}
function storeDetailView(){const n=storeName(st.shop);return `<div class="hi">Магазин MOBILAINISHA</div><h1 class="h1">${esc(n)}</h1><p class="lead">Твоя выбранная точка в Сочи.</p><div class="panel"><div class="keyline"><b>Магазин</b><span>${esc(n)}</span></div><div class="keyline"><b>Адрес</b><span>Пока не указан</span></div><div class="keyline"><b>Режим работы</b><span>Уточняется</span></div><div class="keyline"><b>Наличие товаров</b><span>Демо-каталог</span></div><div class="keyline"><b>Приём в ремонт</b><span>Экран заявки доступен</span></div></div><div class="btnrow"><button class="btn" data-action="catalog">Каталог точки</button><button class="btn secondary" data-action="repair">Ремонт</button></div><button class="link" data-action="stores">← Выбрать другой магазин</button><div class="section-head"><h2>Популярные разделы</h2></div><div class="category-grid">${TYPE_ORDER.slice(0,6).map(catTile).join('')}</div>`}
function cartView(){const items=Object.entries(D.cart).filter(([id,count])=>count>0&&product(id)),total=items.reduce((n,[id,count])=>n+product(id).price*count,0);return `<div class="hi">Мой заказ</div><h1 class="h1">Корзина</h1>${storeStrip()}${items.length?`${items.map(([id,count])=>{let p=product(id);return `<div class="panel"><div class="panel-row"><div style="width:66px;height:62px;background:#f1f5f8;border-radius:12px;display:grid;place-items:center;overflow:hidden">${art(p.cat)}</div><div class="copy"><h3>${esc(p.name)}</h3><div class="small">${fmt(p.price)} · примерная цена</div></div><div class="qty"><button data-action="dec" data-id="${id}">−</button><strong>${count}</strong><button data-action="add" data-id="${id}">+</button></div></div></div>`}).join('')}<div class="panel"><div class="keyline"><b>Тестовая сумма</b><b>${fmt(total)}</b></div><div class="keyline"><b>Самовывоз</b><span>${esc(storeName(st.shop))}</span></div><p>Это симуляция оформления: денег не списываем, заказ в магазины не отправляем.</p><button class="btn block" data-action="checkout">Создать тестовый заказ</button></div>`:empty('Корзина пока пуста','Добавь товары из каталога, чтобы проверить процесс оформления.')+'<button class="btn block" data-action="catalog">Открыть каталог</button>'}`}
function ordersView(){return `<div class="hi">История</div><h1 class="h1">Мои тестовые заказы</h1><p class="lead">Сохраняются только на этом устройстве и в этом браузере.</p>${D.orders.length?D.orders.map(o=>`<div class="panel"><div class="panel-row"><div class="copy"><h3>Заказ ${esc(o.id)}</h3><div class="small">${esc(storeName(o.shop))} · ${new Date(o.date).toLocaleString('ru-RU')}</div><div class="small">${o.items.length} поз. · ${fmt(o.total)}</div></div><span class="badge">Тестовый</span></div></div>`).join(''):empty('Пока нет заказов','Добавь пару товаров в корзину и создай тестовый заказ.')}`}
function repairView(){return `<div class="hi">Сервис MOBILAINISHA</div><h1 class="h1">Ремонт техники</h1><p class="lead">Удобно оставить заявку и проверить статус. Сейчас это тест без передачи данных в сервис.</p><div class="panel"><h3>Новая тестовая заявка</h3><form id="repairForm"><label class="field">Устройство<input name="device" placeholder="Например, тестовый смартфон" required maxlength="60" autocomplete="off"></label><label class="field">Что случилось?<textarea name="issue" required maxlength="150" placeholder="Например, не заряжается. Не вводи реальные контакты"></textarea></label><div class="small">Точка приёма: <b>${esc(storeName(st.shop))}</b>. Настоящие контакты не вводи.</div><button class="btn block" style="margin-top:13px" type="submit">Создать тестовую заявку</button></form></div><div class="panel"><h3>Проверить статус заявки</h3><label class="field">Номер заявки<input id="ticketSearch" inputmode="text" placeholder="Например, R-1001" autocomplete="off" value="${esc(st.ticket)}"></label><button class="btn secondary block" data-action="lookupRepair">Найти заявку</button></div>${D.repairs.length?`<div class="section-head"><h2>Заявки на этом устройстве</h2></div>${D.repairs.map(r=>repairCard(r,false)).join('')}`:''}<div class="note warn">В рабочем приложении здесь будет безопасная регистрация и серверная история ремонтов. Сейчас заявка остаётся только на твоём устройстве.</div>`}
function repairCard(r,staff=false){return `<div class="panel"><div class="panel-row"><div class="copy"><h3>${esc(r.id)} · ${esc(r.device)}</h3><p>${esc(r.issue)}</p><div class="small">${esc(storeName(r.shop))}</div></div><span class="badge ${r.status>=4?'':'warn'}">${STATUSES[r.status]||STATUSES[0]}</span></div>${staff?`<button data-action="nextRepair" data-id="${esc(r.id)}" class="btn secondary block" ${r.status>=5?'disabled':''}>${r.status>=5?'Выдан':'Перевести на следующий этап →'}</button>`:''}</div>`}
function profileView(){return `<div class="hi">Личный кабинет</div><h1 class="h1">Мой профиль</h1><div class="panel"><h3>${D.demoLogin?'Демо-профиль активен':'Войти или зарегистрироваться'}</h3><p>Можно посмотреть, как будут выглядеть вход по телефону и почте. Настоящее SMS или письмо пока не отправляется.</p><button class="btn block" data-action="auth">${D.demoLogin?'Открыть демо-профиль':'Посмотреть регистрацию'}</button></div><div class="panel"><button class="panel-row" data-action="orders" style="width:100%;border:0;background:none;text-align:left;padding:0"><span class="copy"><h3>Заказы</h3><p>${D.orders.length} тестовых заказов</p></span><span class="arrow">›</span></button></div><div class="panel"><button class="panel-row" data-action="favorites" style="width:100%;border:0;background:none;text-align:left;padding:0"><span class="copy"><h3>Избранное</h3><p>${D.favorites.length} товаров</p></span><span class="arrow">›</span></button></div><div class="panel"><button class="panel-row" data-action="repair" style="width:100%;border:0;background:none;text-align:left;padding:0"><span class="copy"><h3>Мои ремонты</h3><p>${D.repairs.length} тестовых заявок</p></span><span class="arrow">›</span></button></div><div class="note">Клиенты не видят служебную панель, внутренние цифры продаж и сотрудников. Все данные на этом этапе демонстрационные.</div>`}
function authView(){if(D.demoLogin)return `<div class="hi">Демо-профиль</div><h1 class="h1">Добро пожаловать!</h1><div class="panel"><h3>Вход для примера завершён</h3><p>Ты увидел сценарий. Никаких SMS и писем не отправлялось.</p><button class="btn secondary block" data-action="signout">Выйти из демо-профиля</button></div>`;return `<div class="hi">Профиль MOBILAINISHA</div><h1 class="h1">Вход и регистрация</h1><p class="lead">Предварительный экран будущей авторизации. Используй только вымышленные данные для теста.</p><div class="chiprow"><button class="chip ${st.authMethod==='phone'?'active':''}" data-action="authMethod" data-name="phone">По номеру</button><button class="chip ${st.authMethod==='email'?'active':''}" data-action="authMethod" data-name="email">По почте</button></div>${st.authStep===0?`<form id="authForm" class="panel"><h3>${st.authMethod==='phone'?'Номер телефона':'Электронная почта'}</h3><label class="field"><input name="identifier" autocomplete="off" required placeholder="${st.authMethod==='phone'?'Только тестовый номер':'Только тестовый email'}" ${st.authMethod==='email'?'type="email"':'type="text"'}></label><p>При нажатии откроется демонстрация подтверждения. Никаких сообщений не отправляется и введённое значение не сохраняется.</p><button class="btn block">Продолжить (демо)</button></form>`:`<form id="codeForm" class="panel"><h3>Введи тестовый код</h3><p>Для демонстрации используй <strong>0000</strong>. Этот код не подтверждает номер или email.</p><label class="field">Код<input name="code" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0000" required></label><button class="btn block">Завершить тестовый вход</button></form>`}<div class="note warn">Настоящая авторизация будет доступна после подключения российского хранилища данных, SMS-сервиса и настроек безопасности.</div>`}
function favoritesView(){let items=GOODS.filter(x=>D.favorites.includes(x.id));return `<div class="hi">Мой выбор</div><h1 class="h1">Избранное</h1><div class="product-grid">${items.length?items.map(cardProduct).join(''):empty('Пока пусто','Нажимай «♡ В избранное» на карточках товаров.')}</div>`}
function orderSuccessView(){let o=D.orders.find(x=>x.id===st.order);return `<div class="hi">Готово</div><h1 class="h1">Тестовый заказ создан</h1><div class="panel"><h3>${esc(o?.id||'Заказ')}</h3><p>Самовывоз: ${esc(storeName(o?.shop??st.shop))}. Это демонстрационная запись — магазин ничего не получил и оплату не принимал.</p><button data-action="orders" class="btn block">Мои заказы</button></div>`}
function empty(title,desc){return `<div class="empty"><div style="font-size:35px">◇</div><b>${esc(title)}</b><p>${esc(desc)}</p></div>`}
function staffShell(){const own=st.role==='owner';let available=own?[['dashboard','Обзор','dashboard'],['branches','Точки','branches'],['sales','Продажи','sales'],['repairs','Ремонты','repair'],['team','Команда','team']]:[['dashboard','Рабочий стол','dashboard'],['sales','Продажи','sales'],['repairs','Ремонты','repair'],['warehouse','Склад','warehouse'],['tasks','Задачи','tasks']];return available}
function staffHead(){return `<div class="rolehead"><span class="role-mark">РЕЖИМ ПРОСМОТРА</span><select id="roleChoice" aria-label="Роль для демонстрации">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${st.role===k?'selected':''}>${v} (демо)</option>`).join('')}</select></div><div class="note warn">Открытый демонстрационный кабинет. Выбор роли не является защитой. Не вводите реальные данные клиентов и сотрудников.</div>`}
function staffDashboard(){const own=st.role==='owner';const sales=D.sales.filter(x=>own||x.shop===st.shop),repairs=D.repairs.filter(x=>own||x.shop===st.shop);return `${staffHead()}<section class="staff-top"><small>МОBILAINISHA · ${own?'ВСЯ СЕТЬ':storeName(st.shop)}</small><h2>${own?'Панель владельца':`Рабочий стол · ${ROLES[st.role]}`}</h2><p>${own?'Четыре магазина в одном окне. Показатели только по тестовым операциям.':'Здесь проходят продажи, заявки и задачи выбранной точки.'}</p><button class="btn" data-action="${own?'branches':'sales'}">${own?'Открыть магазины':'Оформить демо-продажу'} →</button></section>${!own?staffStorePick():''}<div class="section-head"><h2>Показатели</h2><span class="minor">Только тестовые</span></div><div class="metric-grid"><div class="metric"><span>Продажи</span><strong>${sales.length}</strong><small>тестовых операций</small></div><div class="metric"><span>Сумма продаж</span><strong>${fmt(sales.reduce((n,x)=>n+x.price,0))}</strong><small>не реальная выручка</small></div><div class="metric"><span>Ремонты</span><strong>${repairs.length}</strong><small>заявки с этого устройства</small></div><div class="metric"><span>Задачи</span><strong>${D.tasks.filter(t=>!t.done&&(own||t.shop===st.shop)).length}</strong><small>незавершённые</small></div></div><div class="section-head"><h2>Быстрые действия</h2></div><div class="btnrow"><button class="btn secondary" data-action="sales">Продажи</button><button class="btn secondary" data-action="repairs">Ремонты</button><button class="btn secondary" data-action="tasks">Задачи</button></div><div class="panel"><h3>Работа с покупателем</h3><p>В реальной системе сотрудник авторизуется отдельно. Здесь всё работает в демо-режиме на этом устройстве.</p></div>`}
function staffStorePick(){return `<label class="field">Мой магазин<select id="staffStore">${STORE.map((n,i)=>`<option value="${i}" ${st.shop===i?'selected':''}>${n}</option>`).join('')}</select></label>`}
function salesView(){let items=D.sales.filter(x=>st.role==='owner'||x.shop===st.shop);return `${staffHead()}<div class="hi">Продажи · тестовый режим</div><h1 class="h1">Оформить продажу</h1>${staffStorePick()}<p class="lead">Выбирай товар — появится тестовая запись продажи. Реальная касса и платёжная система не подключены.</p><div class="panel"><h3>Товары для демонстрации</h3>${GOODS.slice(0,7).map(p=>`<div class="task"><span style="width:28px;height:33px;flex:none">${art(p.cat)}</span><div class="meta"><b>${esc(p.name)}</b><small>${fmt(p.price)} · демо</small></div><button class="btn" data-action="sell" data-id="${p.id}">Продать</button></div>`).join('')}</div><div class="section-head"><h2>Записанные операции</h2></div>${items.length?items.map(x=>`<div class="panel"><div class="panel-row"><div class="copy"><h3>${esc(x.title)}</h3><div class="small">${esc(storeName(x.shop))} · ${new Date(x.date).toLocaleString('ru-RU')}</div></div><strong>${fmt(x.price)}</strong></div></div>`).join(''):empty('Операций ещё нет','Нажми «Продать», чтобы проверить процесс.')}`}
function repairsStaffView(){let items=D.repairs.filter(x=>st.role==='owner'||x.shop===st.shop);return `${staffHead()}<div class="hi">Сервисная служба</div><h1 class="h1">Ремонты</h1>${staffStorePick()}<div class="panel"><h3>Создать тестовую заявку</h3><form id="staffRepairForm"><label class="field">Устройство<input name="device" placeholder="Например, смартфон (демо)" maxlength="60" required></label><label class="field">Неисправность<input name="issue" placeholder="Не заряжается" maxlength="150" required></label><button class="btn block">Принять в ремонт (демо)</button></form></div>${items.length?items.map(r=>repairCard(r,true)).join(''):empty('Заявок ещё нет','Создай заявку или добавь её через клиентский раздел на этом же устройстве.')}`}
function warehouseView(){return `${staffHead()}<div class="hi">Склад · ${esc(storeName(st.shop))}</div><h1 class="h1">Остатки</h1>${staffStorePick()}<p class="lead">Тестовая модель склада. Количество можно менять, но в реальном магазине оно не обновляется.</p><div class="panel">${GOODS.slice(0,10).map((p,i)=>{let k=st.shop+'_'+p.id,qty=typeof D.quantities[k]==='number'?D.quantities[k]:((st.shop*3+i*2)%12+2);return `<div class="task"><div class="meta"><b>${esc(p.name)}</b><small>Тестовые остатки · ${esc(p.brand)}</small></div><div class="qty"><button data-action="stockDec" data-id="${p.id}">−</button><strong>${qty}</strong><button data-action="stockInc" data-id="${p.id}">+</button></div></div>`}).join('')}</div>`}
function tasksView(){let items=D.tasks.filter(x=>st.role==='owner'||x.shop===st.shop);return `${staffHead()}<div class="hi">Организация работы</div><h1 class="h1">Задачи</h1>${staffStorePick()}<div class="panel"><h3>Новое тестовое задание</h3><form id="taskForm"><label class="field">Описание<input name="task" required maxlength="100" placeholder="Например, проверить витрину"></label><button class="btn block">Добавить задачу</button></form></div>${items.length?items.map(t=>`<div class="panel"><div class="panel-row"><div class="copy"><h3 style="${t.done?'text-decoration:line-through;color:#91a1b0':''}">${esc(t.title)}</h3><div class="small">${esc(storeName(t.shop))}</div></div><button class="btn ${t.done?'secondary':''}" data-action="taskToggle" data-id="${t.id}">${t.done?'Вернуть':'Готово ✓'}</button></div></div>`).join(''):empty('Задач пока нет','Создай задание и отметь его выполненным.')}`}
function branchesView(){return `${staffHead()}<div class="hi">Сеть MOBILAINISHA</div><h1 class="h1">Четыре магазина</h1><div class="store-grid">${STORE.map((name,i)=>{const sales=D.sales.filter(s=>s.shop===i);const repairs=D.repairs.filter(r=>r.shop===i);return `<button class="store-card" data-action="branch" data-shop="${i}"><span class="store-ico">${icon('stores')}</span><b>${esc(name)}</b><small>${sales.length} тестовых продаж · ${repairs.length} ремонтов</small><span class="tick">Подробнее →</span></button>`}).join('')}</div><div class="note">Сейчас общая сеть рассчитывается из тестовых записей в одном браузере. Реальная синхронизация магазинов ещё не подключена.</div>`}
function branchDetailView(){let sales=D.sales.filter(x=>x.shop===st.shop);let repairs=D.repairs.filter(x=>x.shop===st.shop);return `${staffHead()}<div class="hi">Показатели точки</div><h1 class="h1">${esc(storeName(st.shop))}</h1><div class="metric-grid"><div class="metric"><span>Продажи</span><strong>${sales.length}</strong><small>демо</small></div><div class="metric"><span>Выручка</span><strong>${fmt(sales.reduce((a,b)=>a+b.price,0))}</strong><small>демо</small></div><div class="metric"><span>Ремонты</span><strong>${repairs.length}</strong><small>демо</small></div><div class="metric"><span>Задачи</span><strong>${D.tasks.filter(t=>t.shop===st.shop).length}</strong><small>демо</small></div></div><div class="btnrow" style="margin-top:13px"><button class="btn secondary" data-action="branches">Все точки</button><button class="btn" data-action="sales">Продажи</button></div>`}
function teamView(){return `${staffHead()}<div class="hi">Команда</div><h1 class="h1">Роли и доступы</h1><p class="lead">Так будет выглядеть управление сотрудниками. Реальные аккаунты появятся только после защищённого сервера.</p>${Object.entries(ROLES).map(([k,v])=>`<div class="panel"><div class="panel-row"><span class="store-ico" style="margin:0">${icon('team')}</span><div class="copy"><h3>${v}</h3><div class="small">${k==='owner'?'Вся сеть':k==='manager'?'Управление точкой':k==='seller'?'Продажи и товар':'Диагностика и ремонт'}</div></div><span class="badge purple">Макет</span></div></div>`).join('')}<div class="note warn">Сейчас любой может открыть демонстрационный кабинет по прямой ссылке. Он не предназначен для настоящих данных сотрудников или клиентов.</div>`}
function renderView(){if(STAFF){switch(st.view){case 'sales':return salesView();case 'repairs':return repairsStaffView();case 'warehouse':return warehouseView();case 'tasks':return tasksView();case 'branches':return branchesView();case 'branchDetail':return branchDetailView();case 'team':return teamView();default:return staffDashboard()}}
switch(st.view){case 'catalog':return catalogView();case 'stores':return storesView();case 'storeDetail':return storeDetailView();case 'cart':return cartView();case 'repair':return repairView();case 'profile':return profileView();case 'auth':return authView();case 'orders':return ordersView();case 'favorites':return favoritesView();case 'orderSuccess':return orderSuccessView();default:return homeView()}}
function renderNav(){let tabs=STAFF?staffShell():[['home','Главная','home'],['catalog','Каталог','catalog'],['stores','Магазины','stores'],['repair','Ремонт','repair'],['profile','Профиль','profile']];NAV.innerHTML=tabs.map(([v,label,ic])=>`<button class="tab ${st.view===v||(v==='dashboard'&&st.view==='branchDetail')?'active':''}" data-action="nav" data-view="${v}" aria-label="${label}" ${st.view===v?'aria-current="page"':''}><span class="svg-wrap">${icon(ic)}</span>${label}</button>`).join('')}
function render(){ROOT.innerHTML=renderView();renderNav();const cartTotal=Object.values(D.cart).reduce((x,y)=>x+y,0);const counter=document.querySelector('#cartCount');if(counter){counter.hidden=cartTotal===0;counter.textContent=String(cartTotal)}const h=document.getElementById('histLeft');const f=document.getElementById('histRight');h.disabled=histDepth===0&&st.view===ENTRY&&KIND!=='stores';f.disabled=histDepth>=maxDepth;document.getElementById('breadcrumb').textContent=STAFF?(st.role==='owner'?'Владелец':'Сотрудник')+' / '+(st.view==='dashboard'?'Рабочий стол':st.view):(st.view==='home'?'Главная':st.view==='catalog'?'Каталог':st.view==='stores'?'Магазины':st.view==='repair'?'Ремонт':st.view==='profile'?'Профиль':'Раздел')}
const notify=(msg)=>{const el=document.querySelector('#toast');el.textContent=msg;el.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.style.display='none',3000)};
function persist(k){set(k,D[k])}
function saveRepair(device,issue){const id='R-'+(1001+D.repairs.length);D.repairs.unshift({id,device,issue,shop:st.shop,status:0,date:Date.now()});persist('repairs');notify('Тестовая заявка '+id+' создана');return id}
function click(action,el){const id=el.dataset.id,shop=Number(el.dataset.shop);switch(action){
case 'home':if(KIND==='stores')location.assign('./index.html');else jump('home');break;case 'catalog':jump('catalog',{category:'all',brand:'Все',segment:'Все',search:''});break;case 'stores':jump('stores');break;case 'repair':jump(STAFF?'repairs':'repair');break;case 'profile':jump('profile');break;
case 'cart':jump('cart');break;case 'nav':if(KIND==='stores'&&el.dataset.view==='home')location.assign('./index.html');else jump(el.dataset.view);break;case 'cat':pickCategory(el.dataset.type);break;
case 'brand':jump('catalog',{brand:el.dataset.name});break;case 'segment':jump('catalog',{segment:el.dataset.name});break;
case 'store':st.shop=shop;set('shop',st.shop);jump('storeDetail');break;case 'branch':st.shop=shop;set('shop',shop);jump('branchDetail');break;
case 'add':D.cart[id]=(D.cart[id]||0)+1;persist('cart');render();notify('Добавлено в тестовую корзину');break;
case 'dec':if(D.cart[id])D.cart[id]--;persist('cart');render();break;
case 'fav':if(D.favorites.includes(id))D.favorites=D.favorites.filter(x=>x!==id);else D.favorites.push(id);persist('favorites');render();notify('Избранное обновлено');break;
case 'checkout':{const items=Object.entries(D.cart).filter(([x,c])=>c>0&&product(x));if(!items.length)return;const order={id:'M-'+(1001+D.orders.length),shop:st.shop,items:items.map(([id,count])=>({id,count})),total:items.reduce((n,[id,count])=>n+product(id).price*count,0),date:Date.now()};D.orders.unshift(order);persist('orders');D.cart={};persist('cart');jump('orderSuccess',{order:order.id});break;}
case 'orders':jump('orders');break;case 'favorites':jump('favorites');break;case 'auth':jump('auth',{authStep:0});break;case 'authMethod':jump('auth',{authMethod:el.dataset.name,authStep:0});break;case 'signout':D.demoLogin=false;persist('demoLogin');jump('profile');break;
case 'lookupRepair':{const input=document.getElementById('ticketSearch');const num=input?.value.trim().toUpperCase();st.ticket=num;let r=D.repairs.find(x=>x.id===num);notify(r?'Статус '+num+': '+STATUSES[r.status]:'Тестовая заявка не найдена на устройстве');break;}
case 'nextRepair':{const r=D.repairs.find(x=>x.id===id);if(r&&r.status<5)r.status++;persist('repairs');render();notify('Тестовый статус обновлён');break;}
case 'sell':{const p=product(id);if(!p)return;D.sales.unshift({id:'S-'+(1001+D.sales.length),product:p.id,title:p.name,price:p.price,shop:st.shop,date:Date.now()});persist('sales');render();notify('Тестовая продажа записана');break;}
case 'tasks':jump('tasks');break;case 'sales':jump('sales');break;case 'repairs':jump('repairs');break;case 'branches':jump('branches');break;
case 'taskToggle':{const t=D.tasks.find(x=>x.id===id);if(t)t.done=!t.done;persist('tasks');render();break;}
case 'stockDec':case 'stockInc':{const k=st.shop+'_'+id;const i=GOODS.findIndex(x=>x.id===id),base=(st.shop*3+i*2)%12+2;const q=typeof D.quantities[k]==='number'?D.quantities[k]:base;D.quantities[k]=Math.max(0,q+(action==='stockInc'?1:-1));persist('quantities');render();break;}
}}
document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button){e.preventDefault();click(button.dataset.action,button)}});
document.addEventListener('change',e=>{if(e.target.id==='roleChoice'){st.role=e.target.value;st.view='dashboard';histDepth++;maxDepth=histDepth;history.pushState({moba3:true,depth:histDepth,data:snapshot()},'','#role-'+st.role);render()}if(e.target.id==='staffStore'){st.shop=Number(e.target.value);set('shop',st.shop);render()}});
document.addEventListener('input',e=>{if(e.target.id==='productSearch'){st.search=e.target.value;const grid=document.getElementById('productGrid');if(grid)grid.innerHTML=listing().map(cardProduct).join('')||empty('Ничего не найдено','Измени запрос или фильтр');const count=document.getElementById('foundCount');if(count)count.textContent=listing().length+' позиции';}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,data=new FormData(form);if(form.id==='repairForm'){saveRepair(String(data.get('device')).trim(),String(data.get('issue')).trim());render();return}if(form.id==='staffRepairForm'){saveRepair(String(data.get('device')).trim(),String(data.get('issue')).trim());render();return}if(form.id==='taskForm'){const title=String(data.get('task')||'').trim();if(!title)return;D.tasks.unshift({id:'T-'+(1001+D.tasks.length),title,shop:st.shop,done:false});persist('tasks');render();notify('Тестовая задача создана');return}if(form.id==='authForm'){st.authStep=1;render();notify('Тестовый код показан на экране, SMS не отправлено');return}if(form.id==='codeForm'){if(String(data.get('code'))==='0000'){D.demoLogin=true;persist('demoLogin');jump('profile');notify('Демо-вход выполнен')}else notify('Для демонстрации введи код 0000')}});
document.getElementById('histLeft').onclick=back;document.getElementById('histRight').onclick=forward;
document.getElementById('cartOpen').onclick=()=>STAFF?location.assign('./index.html'):jump('cart');
render();
})();
</script></body></html>
