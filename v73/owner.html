<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MOBILAINISHA 7.3 · Владелец</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17263c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.app{max-width:740px;margin:auto;padding:0 15px 100px}.top{background:#102c51;color:white;margin:0 -15px 18px;padding:calc(20px + env(safe-area-inset-top)) 20px 22px;border-radius:0 0 22px 22px}.eyebrow{font-size:12px;opacity:.8}.top h1{font-size:25px;margin:6px 0}.top p{font-size:13px;margin:0;opacity:.85}.headrow,.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:0;border-radius:12px;background:#174d88;color:white;padding:13px 15px;font:inherit;font-weight:600;cursor:pointer}.btn.secondary{background:#e7effa;color:#174d88}.btn.warn{background:#a83e42}.btn:disabled{background:#9da9b9}.card{background:white;border:1px solid #e0e7f1;border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 3px 15px #152e4c06}.card h2{font-size:18px;margin:0 0 12px}.small{font-size:12px;color:#68798e}.muted{color:#68798e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:white;border:1px solid #e1e8f2;border-radius:15px;padding:15px;text-align:left;cursor:pointer;color:inherit}.metric strong{font-size:26px;display:block;margin-bottom:4px}.metric span{font-size:12px;color:#62748a}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.quick button{background:#f0f5fc;color:#183f70;border:0;border-radius:13px;padding:16px 10px;font:inherit;font-weight:600;text-align:left}.quick small{display:block;font-weight:400;color:#68798e;margin-top:4px}.list-item{border-top:1px solid #e8edf4;padding:13px 0}.list-item:first-child{border-top:0}.tag{font-size:12px;padding:5px 9px;border-radius:20px;background:#eaf1fa;color:#244c7b}.danger{background:#fff0ec;color:#a43b27}.success{background:#e8f8ef;color:#21664b}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{border:0;border-radius:99px;background:#e8eef6;color:#264360;padding:9px 12px;white-space:nowrap}.tabs button.active{background:#174d88;color:white}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#fff;border-top:1px solid #dce4ef;padding:8px 7px calc(9px + env(safe-area-inset-bottom));z-index:20}.bottom>div{width:min(740px,100%);display:flex;justify-content:space-around}.bottom button{background:none;border:0;font:inherit;color:#65768b;font-size:12px;padding:7px 5px}.bottom button.active{color:#174d88;font-weight:700}.bottom b{display:block;font-size:21px;margin-bottom:3px}.back{background:none;border:0;font-size:15px;color:#174d88;padding:6px 0 14px}label{display:block;font-size:13px;font-weight:600;margin-top:12px}input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd7e5;border-radius:10px;font:inherit}.note{font-size:12px;color:#6c7b8f;line-height:1.5}.alert{background:#fff7e8;border-left:3px solid #d19b37;padding:11px;border-radius:9px;font-size:13px}.empty{padding:25px 5px;color:#748398;text-align:center}.section-head{font-weight:700;font-size:17px;margin:22px 0 10px}.hidden{display:none}@media(min-width:600px){.quick{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><nav class="bottom"><div><button data-nav="home"><b>⌂</b>Главная</button><button data-nav="stores"><b>▦</b>Магазины</button><button data-nav="approvals"><b>✓</b>Решения</button><button data-nav="tasks"><b>☷</b>Задачи</button><button data-nav="more"><b>☰</b>Ещё</button></div></nav><script>
'use strict';const SHOPS=['Хоста','Кудепста','Блиново','Чайсовхоз'],KEY='mob73_owner_mobile_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.records))data={records:[],log:[]};let view='home',shop='Все магазины',filter='Все';const E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);function save(){localStorage.setItem(KEY,JSON.stringify(data))}function move(v){view=v;render();scrollTo(0,0)}function count(t){return data.records.filter(x=>x.type===t&&x.status!=='Закрыто'&&x.status!=='Отклонено').length}function pending(){return data.records.filter(x=>x.status==='Ожидает владельца'||x.status==='Ожидает оплаты')}function needs(){return data.records.filter(x=>x.status==='Проблема'||x.status==='Просрочено'||x.status==='Ожидает владельца'||x.status==='Ожидает оплаты')}function add(type,fields){const rec={id:'M'+Date.now().toString(36),type,status:type==='Закупка'?'Ожидает владельца':type==='Расход'?'Ожидает владельца':'Открыто',at:new Date().toLocaleString('ru-RU'),...fields};data.records.unshift(rec);data.log.unshift({at:rec.at,action:'Создано',id:rec.id});save();move(type==='Закупка'||type==='Расход'?'approvals':type==='Задача'?'tasks':'stores')}function act(id,action){const x=data.records.find(r=>r.id===id);if(!x)return;if(action==='approve'){if(x.status==='Ожидает владельца')x.status=x.type==='Закупка'?'Ожидает оплаты':'Утверждено';else if(x.status==='Ожидает оплаты')x.status='Оплата разрешена';else return}else if(action==='reject'){const why=prompt('Причина отказа');if(!why?.trim())return;x.reason=why.trim();x.status='Отклонено'}else if(action==='issue'){const why=prompt('Опишите проблему');if(!why?.trim())return;x.reason=why.trim();x.status='Проблема'}else if(action==='close'){x.status='Закрыто'}else return;data.log.unshift({at:new Date().toLocaleString('ru-RU'),action:action+' → '+x.status,id});save();render()}function record(x){const buttons=x.status==='Ожидает владельца'||x.status==='Ожидает оплаты'?'<button class="btn" data-act="approve" data-id="'+E(x.id)+'">'+(x.status==='Ожидает оплаты'?'Разрешить оплату':'Согласовать')+'</button> <button class="btn secondary" data-act="reject" data-id="'+E(x.id)+'">Отказать</button>':x.status==='Открыто'?'<button class="btn secondary" data-act="issue" data-id="'+E(x.id)+'">Сообщить о проблеме</button> <button class="btn" data-act="close" data-id="'+E(x.id)+'">Завершить тест</button>':'';return '<div class="list-item"><div class="row"><strong>'+E(x.title)+'</strong><span class="tag '+(x.status==='Проблема'?'danger':'')+'">'+E(x.status)+'</span></div><p class="small">'+E(x.shop)+' · '+E(x.type)+' · '+E(x.at)+'</p>'+(x.amount?'<p><b>'+E(x.amount)+' ₽</b></p>':'')+(x.details?'<p>'+E(x.details)+'</p>':'')+(x.reason?'<p class="alert">'+E(x.reason)+'</p>':'')+buttons+'</div>'}function records(list){return list.length?list.map(record).join(''):'<div class="empty">Пока нет тестовых записей</div>'}function header(title,desc){return '<header class="top"><div class="eyebrow">MOBILAINISHA · 7.3 / ТЕСТ</div><h1>'+E(title)+'</h1><p>'+E(desc)+'</p></header>'}function card(title,body){return '<section class="card"><h2>'+title+'</h2>'+body+'</section>'}function home(){return header('Добрый день, владелец','Четыре магазина · быстрый контроль')+'<div class="grid"><button class="metric" data-go="stores"><strong>4</strong><span>Магазина</span></button><button class="metric" data-go="approvals"><strong>'+pending().length+'</strong><span>Ждут решения</span></button><button class="metric" data-go="alerts"><strong>'+needs().length+'</strong><span>Требуют внимания</span></button><button class="metric" data-go="tasks"><strong>'+count('Задача')+'</strong><span>Активные задачи</span></button></div>'+card('Быстрые действия','<div class="quick"><button data-go="create-purchase">＋ Закупка<small>Запрос на согласование</small></button><button data-go="create-task">＋ Поручение<small>Назначить сотруднику</small></button><button data-go="create-issue">＋ Проблема<small>Зафиксировать событие</small></button><button data-go="create-expense">＋ Расход<small>Согласование суммы</small></button></div>')+card('Сейчас важно',records(needs().slice(0,5))+'<button class="btn secondary" data-go="alerts">Посмотреть все события</button>')+card('Магазины','<div class="grid">'+SHOPS.map(x=>'<button class="metric" data-shop="'+E(x)+'"><strong style="font-size:17px">'+E(x)+'</strong><span>'+data.records.filter(r=>r.shop===x&&r.status!=='Закрыто').length+' открытых записей</span></button>').join('')+'</div>')+'<p class="note">Цифры относятся только к созданным тестовым записям, не к реальным продажам и остаткам 1С.</p>'}function stores(){return header('Магазины','Выберите магазин и откройте его операции')+card('Выберите магазин','<div class="grid">'+SHOPS.map(x=>'<button class="metric" data-shop="'+E(x)+'"><strong style="font-size:18px">'+E(x)+'</strong><span>Открыть магазин →</span></button>').join('')+'</div>')}function shopPage(){const list=data.records.filter(x=>x.shop===shop);return header(shop,'Задачи, согласования и события магазина')+'<button class="back" data-go="stores">← Все магазины</button><div class="grid"><button class="metric" data-go="approvals"><strong>'+list.filter(x=>x.status==='Ожидает владельца'||x.status==='Ожидает оплаты').length+'</strong><span>Согласования</span></button><button class="metric" data-go="alerts"><strong>'+list.filter(x=>x.status==='Проблема').length+'</strong><span>Проблемы</span></button></div>'+card('Быстрые действия','<div class="quick"><button data-go="create-task">＋ Поручение</button><button data-go="create-purchase">＋ Закупка</button><button data-go="create-issue">＋ Проблема</button><button data-go="create-expense">＋ Расход</button></div>')+card('Операции магазина',records(list))}function approvals(){return header('Мои решения','Только то, что требует вашего согласования')+card('Ожидают решения · '+pending().length,records(pending()))+card('Последние решения',records(data.records.filter(x=>['Оплата разрешена','Утверждено','Отклонено'].includes(x.status)).slice(0,10)))}function tasks(){return header('Поручения','Задачи по всем четырём магазинам')+'<button class="btn" data-go="create-task">＋ Новое поручение</button>'+card('Все поручения',records(data.records.filter(x=>x.type==='Задача')))}function alerts(){return header('События и нарушения','Согласования, проблемы и просрочки')+card('Требуют внимания',records(needs()))}function more(){return header('Дополнительно','История, правила и статус подключений')+card('Разделы','<div class="quick"><button data-go="alerts">События</button><button data-go="history">История</button><button data-go="status">Интеграции</button><button data-go="rules">Правила</button></div>')+card('Тестовая версия','<p class="note">Данные сохраняются только в браузере этого устройства. Нет реальных учётных записей, синхронизации, push и подключения 1С. Не используйте реальные персональные данные.</p>')}function history(){return header('Журнал действий','Последние операции в тесте')+card('События',data.log.length?data.log.map(x=>'<div class="list-item"><strong>'+E(x.action)+'</strong><p class="small">'+E(x.at)+' · '+E(x.id)+'</p></div>').join(''):'<div class="empty">Журнал пуст</div>')}function status(){return header('Интеграции','Текущий технический статус')+card('Не подключено','<p>1С:Фреш · СберБизнес · MyWork2 · push-уведомления · единый сервер · защищённая авторизация.</p><p class="alert">В этой версии нет реальных финансовых операций.</p>')}function rules(){return header('Правила и контроль','Утверждённые процессы сохранены отдельно')+card('Контрольная точка','<p>График 09:00–20:00; фото смены; согласование закупки и отдельно оплаты; ремонты и выдача; перемещения и двойная приёмка; 30/60/90; расчёт зарплат; резервы; инвентаризация; права ролей.</p><p><a href="https://github.com/aznaurxam-commits/mobilainisha-app/blob/gh-pages/PROJECT_CHECKPOINT_2026-11-14.md">Открыть полный утверждённый документ</a></p>')}function create(){let type=view==='create-purchase'?'Закупка':view==='create-task'?'Задача':view==='create-expense'?'Расход':'Проблема';return header('Создать: '+type,'Короткая форма для тестирования')+'<button class="back" data-go="home">← На главную</button><section class="card"><form id="create"><label>Магазин</label><select name="shop">'+SHOPS.map(x=>'<option '+(shop===x?'selected':'')+'>'+E(x)+'</option>').join('')+'</select><label>Название / предмет</label><input name="title" required placeholder="Например: заказ экранов"><label>Описание</label><textarea name="details" rows="3" placeholder="Что нужно сделать"></textarea>'+(type==='Закупка'||type==='Расход'?'<label>Сумма, ₽</label><input name="amount" type="number" min="0" required>':'')+(type==='Задача'?'<label>Ответственный</label><input name="assignee" required placeholder="Сотрудник"><label>Срок</label><input name="deadline" type="datetime-local" required>':'')+'<button class="btn" type="submit">Сохранить тестовую запись</button></form></section>'}function render(){const pages={home,stores,shop:shopPage,approvals,tasks,alerts,more,history,status,rules};$('app').innerHTML='<div class="app">'+(view.startsWith('create-')?create():pages[view]?pages[view]():home())+'</div>';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>move(b.dataset.go));document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>{shop=b.dataset.shop;move('shop')});document.querySelectorAll('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===view);b.onclick=()=>move(b.dataset.nav)});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.id,b.dataset.act));if($('create'))$('create').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let type=view==='create-purchase'?'Закупка':view==='create-task'?'Задача':view==='create-expense'?'Расход':'Проблема';add(type,f)}}render();
</script></body></html>
