MODULES.push(['Контроль исключений','owner,manager,accountant','Список просрочек, расхождений и операций, требующих решения']);MODULES.push(['Аналитика и улучшения','owner,manager,accountant','Сводные показатели, причины задержек, рекомендации по проблемам']);function render(){let tab=state.tab;const m=MODULES[tab];let items=state.items.filter(x=>tab===0||tab===10||tab===12||tab===13||({1:'shift',2:'task',3:'repair',4:'handoff',5:'stock',6:'purchase',7:'finance',9:'client'})[tab]===x.type).filter(x=>state.role==='owner'||state.role==='accountant'||state.role==='manager'||x.shop===state.shop);let head='<div class="head"><h1>MOBILAINISHA · 7.3</h1><div class="small">Единая проверочная сборка · версия 7.3 · только тестовые данные</div><div class="bar"><label>Роль<select id="role">'+Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'" '+(state.role===k?'selected':'')+'>'+E(v)+'</option>').join('')+'</select></label><label>Магазин<select id="shop">'+SHOPS.map(x=>'<option '+(x===state.shop?'selected':'')+'>'+E(x)+'</option>').join('')+'</select></label></div></div>';let nav='<nav class="nav">'+MODULES.map((v,i)=>'<button data-tab="'+i+'" class="'+(i===tab?'active':'')+'">'+E(v[0])+'</button>').join('')+'</nav>';let body='<div class="panel"><h2>'+E(m[0])+'</h2><p class="muted">'+E(m[2])+'</p><div class="chips">'+m[1].split(',').map(r=>'<span class="chip">'+E(ROLES[r])+'</span>').join('')+'</div></div>';if(tab===12){const alerts=state.items.filter(x=>x.status==='Расхождение'||x.status==='На проверке'||x.status==='Приёмка ожидает проверки'||x.status==='Закупка разрешена'||(x.type==='task'&&x.deadline&&Date.parse(x.deadline)<Date.now()&&!['Подтверждено'].includes(x.status)));body+='<div class="panel"><h3>Требует внимания: '+alerts.length+'</h3>'+alerts.map(x=>'<div class="entry"><b>'+E(x.type)+' · '+E(x.order||x.item||x.employee||x.id)+'</b><p class="muted">'+E(x.shop)+' · '+E(x.status)+'</p></div>').join('')+(alerts.length?'':'<p class="good">Нет открытых исключений среди тестовых записей.</p>')+'</div><p class="warning">Автоматические уведомления в фоне пока не подключены. Это контроль по данным браузера.</p>'}if(tab===13){const counts=SHOPS.map(sh=>({shop:sh,all:state.items.filter(x=>x.shop===sh).length,issues:state.items.filter(x=>x.shop===sh&&x.status==='Расхождение').length,repairs:state.items.filter(x=>x.shop===sh&&x.type==='repair'&&x.status!=='Выдано').length}));body+='<div class="grid">'+counts.map(x=>'<div class="tile"><strong>'+E(x.shop)+'</strong>Записей: '+x.all+'<p>Расхождений: '+x.issues+'</p><p>Открытых ремонтов: '+x.repairs+'</p></div>').join('')+'</div><div class="panel"><h3>Рекомендации по данным теста</h3><p>Проверьте незакрытые расхождения, задержки ремонтов и просроченные задания. Для анализа реальной выручки и динамики нужна синхронизация с 1С.</p></div>'}if(!allowed(m)&&tab!==10){body+='<p class="warning">Этот раздел не входит в обычный кабинет выбранной роли. Доступен только для обзора в деморежиме.</p>'}if(tab===0){body+='<div class="grid">'+[['Магазины',4],['Тестовые записи',state.items.length],['Ожидают согласования',state.items.filter(x=>['Создано','На проверке','Приёмка ожидает проверки','Расхождение'].includes(x.status)).length],['Открытые ремонты',state.items.filter(x=>x.type==='repair'&&x.status!=='Выдано').length]].map(([a,b])=>'<div class="tile"><strong>'+b+'</strong>'+a+'</div>').join('')+'</div><div class="panel"><h3>Приоритеты владельца</h3><p>Критические события → согласования → сводка ИИ → магазины → сотрудники → ремонты → финансы → отчёты.</p><p class="warning">Реальные push-уведомления и сводки 09:15 / 20:15 требуют сервера. Здесь отображается схема контроля, не автоматическая рассылка.</p></div>'}if(tab===7){body+='<div class="panel"><h3>Калькулятор зарплаты продавца</h3><label>Смены<input type="number" id="shifts" min="0" value="15"></label><label>Установки стекла / плёнки за месяц<input type="number" id="installs" min="0" value="55"></label><label>Выполнение плана, %<input type="number" id="plan" min="0" value="110"></label><button id="calc">Рассчитать</button><div id="calcresult"></div><p class="muted">Ремонты и новые телефоны не включаются в плановую выручку. Ориентир: 13 500 ₽ за смену.</p></div>'}if(tab===8){body+='<div class="panel"><h3>Учёт и подключения</h3><p>1С:Розница 3.0 в 1С:Фреш — основная учётная база четырёх магазинов. Внеучётные расходы с фото чеков передаются бухгалтеру. СберБизнес — безнал. Интеграции ещё не подключены.</p></div>'}if(tab===11){body+='<div class="panel"><h3>Состояние интеграций</h3><p>1С:Фреш — не подключена; MyWork2 — не подключён; СберБизнес — не подключён; камеры — проект; доступ 24/7 — будущая функция. Платёжные операции в этом прототипе не выполняются.</p></div>'}if(tab===9){body+='<div class="panel"><h3>График напоминаний</h3><p>Готовность: сразу → +24 часа → +3 дня → +7 дней (обязательный звонок) → +14 дней (проверка управляющим). После подтверждённой выдачи напоминания прекращаются.</p><p>Гарантия: 14 календарных дней на оригинальные запчасти; отсутствие дополнительной добровольной гарантии не отменяет обязательные права клиента.</p></div>'}if(tab===2){body+='<div class="panel"><h3>Эскалация поручений</h3><p>Просрочка +30 минут: напоминание. +60 минут: повтор и уведомление владельца после второго напоминания. +90 минут: дополнительная эскалация.</p><p class="warning">Таймеры пока не работают в фоне: этот экран проверяет утверждённые правила, а не отправляет уведомления.</p></div>'}if(tab===5){body+='<div class="panel"><h3>Правила склада</h3><p>Ежедневная выборочная и ежемесячная полная инвентаризация. Слепой пересчёт и повторный независимый пересчёт расхождений. Резерв клиента — 24 часа с продлением; ИИ не снимает его самостоятельно.</p></div>'}if(tab!==8&&tab!==11){body+='<div class="panel">'+formFor(tab)+'</div>'}if(tab===10){body+='<div class="panel"><h3>Журнал действий</h3>'+state.events.slice(0,80).map(e=>'<div class="entry muted">'+E(e.time)+' · '+E(ROLES[e.role])+' · '+E(e.shop)+' · '+E(e.action)+'</div>').join('')+'</div>'}else{body+='<div class="panel"><h3>Записи и действия</h3>'+items.map(record).join('')+(items.length?'':'<p class="muted">Записей пока нет. Создайте тестовую запись.</p>')+'</div>'}body+='<div class="panel"><h3>Утверждённые правила этого раздела</h3>'+RULES.filter(r=>tab===0||tab===10||({1:'shift',2:'task',3:'repair',4:'handoff',5:'stock',6:'purchase',7:'finance',9:'client'})[tab]===r[4]).map(r=>'<div class="entry"><strong>'+E(r[1])+'</strong><p>'+E(r[2])+'</p><span class="muted">'+E(r[3].split(',').map(x=>ROLES[x]).join(' · '))+'</span></div>').join('')+'</div>';$('root').innerHTML='<div class="shell">'+head+'<div class="layout">'+nav+'<main class="main">'+body+'<p class="footer">Это прототип проверки процессов. Данные только в этом браузере; роли переключаются без авторизации. Не вводите реальные персональные данные и не используйте для учёта.</p></main></div></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=+b.dataset.tab;persist();render()});$('role').onchange=e=>{state.role=e.target.value;persist();render()};$('shop').onchange=e=>{state.shop=e.target.value;persist();render()};document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.id,b.dataset.act));document.querySelectorAll('[data-photo]').forEach(input=>input.onchange=()=>{const f=input.files&&input.files[0],x=state.items.find(y=>y.id===input.dataset.photo);if(!f||!x)return;if(f.size>350000){alert('Для теста выберите фото до 350 КБ. Реальное хранение фото потребует сервер.');return}const reader=new FileReader();reader.onload=()=>{x.photoEvidence={name:f.name,time:new Date().toLocaleString('ru-RU'),data:reader.result};audit(x,'Прикреплено фото');render()};reader.readAsDataURL(f)});if($('newform'))$('newform').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let type=({1:'shift',2:'task',3:'repair',4:'handoff',5:'stock',6:'purchase',7:'finance',9:'client'})[state.tab];make(type,f)};if($('calc'))$('calc').onclick=()=>{let z=bonus(Math.max(0,+$('shifts').value||0),Math.max(0,+$('installs').value||0),Math.max(0,+$('plan').value||0));$('calcresult').innerHTML='<p class="good">Смены: '+z.base.toLocaleString('ru-RU')+' ₽; установки: '+z.glass.toLocaleString('ru-RU')+' ₽; премия за план: '+z.plan.toLocaleString('ru-RU')+' ₽. <strong>Итого: '+z.total.toLocaleString('ru-RU')+' ₽</strong></p>'}}render();</script></body></html>
