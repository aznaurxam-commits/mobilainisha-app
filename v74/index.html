all></div><h1>'+esc(t)+'</h1><small>'+esc(sub)+'</small></header>'}function card(t,content){return '<section class="card"><h2>'+t+'</h2>'+content+'</section>'}function btn(t,p){return '<button class="btn ghost" data-go="'+p+'">'+t+'</button>'}function rows(items){return items.length?items.map(x=>'<div class="item"><div class="row"><h3>'+esc(x.title)+'</h3><span class="pill '+priority(x)+'">'+esc(stat(x))+'</span></div><p>'+esc(x.type)+' · '+esc(x.shop)+' · '+esc(x.at)+'</p>'+(x.due?'<p>Срок: '+esc(new Date(x.due).toLocaleString('ru-RU'))+'</p>':'')+(x.assignee?'<p>Ответственный: '+esc(x.assignee)+'</p>':'')+'<div class="item-actions"><button class="btn ghost" data-open="'+esc(x.id)+'">Открыть →</button></div></div>').join(''):'<div class="empty">Нет записей</div>'}function active(){return db.items.filter(x=>!['Завершено','Отклонено','Выдано'].includes(x.status))}function queue(){return active().filter(x=>x.status==='Ожидает владельца'||x.status==='Ожидает оплаты'||x.status==='Проблема'||isLate(x))}function visible(){return owner()?db.items:db.items.filter(x=>x.role===role||x.assignee===role)}function home(){const all=active(),mine=visible(),ownerQ=all.filter(x=>x.status==='Ожидает владельца'||x.status==='Ожидает оплаты'||x.status==='Передано владельцу'),managerQ=all.filter(x=>x.status==='Ожидает управляющего'||x.status==='Проблема'||isLate(x));if(owner())return header('Пульт владельца','Вся сеть под контролем · только важные решения')+'<div class="overview"><button class="tile" data-go="alerts"><b>'+ownerQ.length+'</b><small>Требуют вашего решения</small></button><button class="tile" data-go="stores"><b>4</b><small>Магазина</small></button><button class="tile" data-go="list"><b>'+all.length+'</b><small>Операций в работе</small></button><button class="tile" data-go="alerts"><b>'+managerQ.length+'</b><small>Вопросы у управляющих</small></button></div>'+card('Требуют вашего решения','<p class="sectionhint">Только важные согласования и вопросы от управляющих.</p>'+rows( {let a=visible();if(filter==='Активные')a=a.filter(x=>!['Завершено','Отклонено','Выдано'].includes(x.status));if(filter==='Срочные')a=a.filter(x=>x.urgent||isLate(x)||x.status==='Проблема');if(filter==='Завершённые')a=a.filter(x=>['Завершено','Отклонено','Выдано'].includes(x.status));return header('Все операции','Одна лента без дублирующих разделов')+'<div class="seg">'+['Активные','Срочные','Завершённые','Все'].map(x=>'<button data-filter="'+x+'" class="'+(filter===x?'active':'')+'">'+x+'</button>').join('')+'</div>'+card('Операции · '+a.length,rows(a))}function stores(){return header('Магазины','Выберите магазин')+card('Четыре точки','<div class="grid">'+SHOPS.map(x=>'<button class="tile" data-shop="'+esc(x)+'"><b style="font-size:17px">'+esc(x)+'</b><small>'+active().filter(i=>i.shop===x).length+' активных</small></button>').join('')+'</div>')}function shop(){return header(selected,'События и операции магазина')+'<button class="back" data-go="stores">← Магазины</button>'+card('Операции',rows(db.items.filter(x=>x.shop===selected)))+btn('＋ Создать операцию','choose')}function alerts(){const x=owner()?active().filter(i=>['Ожидает владельца','Ожидает оплаты','Передано владельцу'].includes(i.status)):role==='Управляющий'?active().filter(i=>['Ожидает управляющего','Проблема'].includes(i.status)||isLate(i)):visible().filter(i=>i.urgent||isLate(i)||i.status==='Проблема');return header('Требуют внимания',owner()?'Только решения владельца':role==='Управляющий'?'Очередь управляющего':'Ваши срочные вопросы')+card('Очередь · '+x.length,rows(x))}function choose(){return header('Новая операция','Выберите тип действия')+card('Операции','<div class="grid">'+(owner()?CATS:WORK[role]).map(x=>'<button class="tile" data-type="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>')}function form(){const attachments=['Приёмка','Перемещение','Доставка','Ремонт','Смена','Расход','Закупка','Инвентаризация'].includes(type);return header(type,'Создание тестовой записи')+'<button class="back" data-go="choose">← Назад</button><section class="card"><form id="newform"><label class="field">Магазин</label><select name="shop">'+SHOPS.map(x=>'<option>'+x+'</option>').join('')+'</select>'+(type==='Перемещение'||type==='Доставка'?'<label class="field">Куда / получатель</label><input name="destination" required placeholder="Магазин назначения или получатель">':'')+'<label class="field">Название / номер документа</label><input name="title" required maxlength="120" placeholder="Например: ремонт № 124"><label class="field">Описание / состав</label><textarea name="details" placeholder="Кратко, по делу"></textarea><label class="field">Ответственный</label><input name="assignee" placeholder="Имя или должность"><label class="field">Срок</label><input type="datetime-local" name="due"><label class="field">Приоритет</label><select name="urgent"><option value="">Обычный — зелёный</option><option value="1">Срочно — жёлтый</option></select>'+(type==='Продажа'||type==='Закупка'||type==='Расход'||type==='Оплата закупки'?'<label class="field">Сумма, ₽</label><input type="number" name="amount" min="0" step="0.01">':'')+(attachments?'<label class="field">Фото, накладные, документы, видео</label><input id="uploads" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"><p class="note">Файлы сохраняются в локальном хранилище браузера на этом устройстве. Для большого видео может не хватить места; не используйте реальные документы в демо.</p>':'')+'<button class="btn" type="submit">Сохранить</button></form></section>'}function detail(){const x=db.items.find(i=>i.id===selected);if(!x)return home();const allow=owner()||role==='Управляющий'||x.role===role;const docs=x.files||[];return header(x.title,x.type+' · '+x.shop)+'<button class="back" data-go="list">← К операциям</button>'+card('Состояние','<div class="row"><span class="pill '+priority(x)+'">'+esc(stat(x))+'</span><span class="small">'+esc(x.at)+'</span></div><p>'+esc(x.details||'Описание не добавлено')+'</p>'+(x.destination?'<p>Куда: '+esc(x.destination)+'</p>':'')+(x.assignee?'<p>Ответственный: '+esc(x.assignee)+'</p>':'')+(x.amount?'<p>Сумма: '+esc(x.amount)+' ₽</p>':'')+(x.due?'<p>Срок: '+esc(new Date(x.due).toLocaleString('ru-RU'))+'</p>':'')+(x.reason?'<p class="warning">'+esc(x.reason)+'</p>':'')+(allow?'<div class="item-actions">'+(['Ожидает владельца','Передано владельцу'].includes(x.status)&&owner()?'<button class="btn green" data-action="approve">Согласовать</button><button class="btn red" data-action="reject">Отказать</button>':'')+(x.status==='Ожидает оплаты'&&owner()?'<button class="btn green" data-action="pay">Разрешить оплату</button>':'')+(!['Завершено','Отклонено','Выдано'].includes(x.status)?'<button class="btn ghost" data-action="next">Следующий этап</button><button class="btn ghost" data-action="problem">Проблема</button>'+(role==='Управляющий'&&['Проблема','Ожидает управляющего'].includes(x.status)?'<button class="btn red" data-action="escalate">Передать владельцу</button><button class="btn green" data-action="resolve">Решено управляющим</button>':''):'')+'</div>':'') )+card('Вложения · '+docs.length,(docs.length?docs.map(f=>'<div class="attachment"><span>📎 '+esc(f.name)+' <small>'+Math.round(f.size/1024)+' КБ</small></span><button class="btn ghost" data-file="'+esc(f.id)+'">Открыть</button></div>').join(''):'<p class="muted">Нет вложений</p>')+(allow?'<label class="field">Добавить фото, накладную или видео</label><input type="file" id="morefiles" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt">':''))+card('История',db.audit.filter(e=>e.id===x.id).map(e=>'<div class="item"><b>'+esc(e.action)+'</b><p class="small">'+esc(e.at)+' · '+esc(e.role)+'</p></div>').join(''))}function more(){return header('Дополнительно','Всё второстепенное — здесь')+card('Настройки и справка','<div class="grid"><button class="tile" data-go="choose">Все типы операций</button><button class="tile" data-go="audit">Журнал</button><button class="tile" data-go="rules">Правила</button><button class="tile" data-go="status">Подключения</button></div>')+card('Безопасность теста','<p class="warning">Переключение должностей — только демонстрация. Никакой серверной проверки прав здесь нет. Не используйте реальные данные клиентов, накладные, деньги или подписи.</p>')}function audit(){return header('Журнал','Все действия в этом браузере')+card('Записи',db.audit.map(x=>'<div class="item"><b>'+esc(x.action)+'</b><p class="small">'+esc(x.role)+' · '+esc(x.at)+' · '+esc(x.id)+'</p></div>').join('')||'<div class="empty">Пусто</div>')}function rules(){return header('Правила','Контрольная точка проекта')+card('Утверждённые требования','<p>09:00–20:00, фото смены, 30/60/90, закупка и отдельная оплата, двухсторонние передачи, слепая инвентаризация, контроль ремонта и выдачи, уведомления клиентов, расчёт зарплат.</p><p><a href="https://github.com/aznaurxam-commits/mobilainisha-app/blob/gh-pages/PROJECT_CHECKPOINT_2026-11-14.md">Полный перечень требований</a></p><p class="warning">Перечисление правил не означает, что все автоматические проверки уже реализованы.</p>')}function status(){return header('Подключения','Что ещё требуется для реальной эксплуатации')+card('Пока не подключено','<p>Серверная база, настоящая авторизация, проверка прав, 1С:Фреш, СберБизнес, push, SMS, автоматические напоминания, серверное хранение вложений и неизменяемый журнал.</p>')}function render(){const p={home,list,stores,shop,alerts,choose,form,detail,more,audit,rules,status};el('root').innerHTML='<div class="wrap"><section class="rolebox"><label>Должность · тестовый просмотр</label><select id="role">'+ROLES.map(r=>'<option '+(r===role?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select></section>'+(p[page]||home)()+'</div>';el('nav').innerHTML=[['home','⌂','Главная'],['list','☷','Операции'],['choose','＋','Создать'],['alerts','!','Срочно'],['more','☰','Ещё']].map(x=>'<button data-go="'+x[0]+'" class="'+(page===x[0]?'active':'')+'"><b>'+x[1]+'</b>'+x[2]+'</button>').join('');el('role').onchange=e=>{role=e.target.value;go('home')};document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;go('form')});document.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>go('shop',b.dataset.shop));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go('detail',b.dataset.open));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>download(b.dataset.file));if(el('newform'))el('newform').onsubmit=create;if(el('morefiles'))el('morefiles').onchange=e=>attach(selected,e.target.files)}function log(id,action){db.audit.unshift({id,action,role,at:now()});save()}function act(action){const x=db.items.find(i=>i.id===selected);if(!x)return;if(action==='next'&&['Ремонт','Перемещение','Доставка','Смена'].includes(x.type)&&!(x.files||[]).length){alert('Для следующего этапа необходимо сначала прикрепить подтверждающее фото или документ.');return}if(['approve','reject','pay'].includes(action)&&!owner())return alert('Только владелец');if(action==='reject'||action==='problem'||action==='escalate'){const reason=prompt('Укажите причину');if(!reason?.trim())return;x.reason=reason.trim()}if(action==='escalate'&&role!=='Управляющий')return alert('Передать владельцу может управляющий');if(action==='resolve'&&role!=='Управляющий')return alert('Решение управляющего');if(action==='escalate'){x.status='Передано владельцу'}else if(action==='resolve'){x.status='Завершено'}else if(action==='approve'){x.status=x.type==='Закупка'?'Ожидает оплаты':'Согласовано'}else if(action==='pay'){x.status='Оплата разрешена'}else if(action==='reject'){x.status='Отклонено'}else if(action==='problem'){x.status=role==='Управляющий'?'Проблема':'Ожидает управляющего'}else if(action==='next'){const stages={'Ремонт':['Принят','Диагностика','В работе','Готов','Выдано'],'Перемещение':['Заявка','Согласование отправки','В пути','Приёмка','Завершено'],'Доставка':['Назначено','Забрано','В пути','Передано','Завершено'],'Смена':['Открыта','В работе','Закрыта','Завершено'],'Поручение':['Открыто','В работе','Завершено']};const arr=stages[x.type]||['Открыто','В работе','Завершено'];const i=arr.indexOf(x.status);x.status=arr[Math.min(i+1,arr.length-1)]}log(x.id,'Статус: '+x.status);render()}async function create(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),id='T'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const x={id,type,role,shop:f.shop,title:f.title,details:f.details,assignee:f.assignee,destination:f.destination||'',amount:f.amount||'',due:f.due||'',urgent:f.urgent==='1',at:now(),status:type==='Закупка'||type==='Оплата закупки'||type==='Списание'?'Ожидает владельца':'Открыто',files:[]};db.items.unshift(x);log(id,'Создано: '+type);const files=el('uploads')?.files;if(files?.length)await attach(id,files,false);go('detail',id)}function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('mob74_files',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function attach(id,files,rerender=true){const x=db.items.find(i=>i.id===id);if(!x)return;let store;try{store=await openDB()}catch{return alert('Хранилище файлов недоступно')};for(const file of Array.from(files)){if(file.size>30*1024*1024){alert('Файл '+file.name+' больше 30 МБ. В демо он пропущен.');continue}const fid=id+'_'+Date.now()+'_'+Math.random().toString(36).slice(2);try{await new Promise((res,rej)=>{const t=store.transaction('files','readwrite');t.objectStore('files').put({id:fid,blob:file});t.oncomplete=res;t.onerror=()=>rej(t.error)});x.files.push({id:fid,name:file.name,size:file.size,type:file.type});log(id,'Добавлен файл: '+file.name)}catch{alert('Не удалось сохранить '+file.name+'. Возможно, закончилось место.')}}store.close();save();if(rerender)render()}async function download(fid){try{const d=await openDB();const v=await new Promise((res,rej)=>{const q=d.transaction('files').objectStore('files').get(fid);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});d.close();if(!v)return alert('Файл не найден');const u=URL.createObjectURL(v.blob);const a=document.createElement('a');a.href=u;a.download=v.blob.name||'attachment';a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}catch{alert('Не удалось открыть файл')}}render();
</script></body></html>
