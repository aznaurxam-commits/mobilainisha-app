<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOBILAINISHA — клиентам</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#162b43;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.app{max-width:700px;margin:auto;padding:0 17px 100px}.hero{background:linear-gradient(135deg,#0c2039,#205b82);color:white;margin:0 -17px;padding:45px 24px 32px;border-radius:0 0 30px 30px}.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#b6d8ec}.hero h1{font-size:32px;line-height:1.08;letter-spacing:-1px;margin:20px 0 10px}.hero p{color:#d5e5f0;font-size:14px;line-height:1.5}.hero .cta{background:white;color:#174267}.cta{border:0;border-radius:13px;padding:14px 17px;font-weight:750;font-size:14px;cursor:pointer}.section{margin:26px 0 12px;font-size:19px;letter-spacing:-.4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.service{border:1px solid #e0e7ef;background:white;text-align:left;padding:18px;border-radius:19px;min-height:155px;box-shadow:0 8px 20px #172f4b0a;cursor:pointer}.service .ic{display:grid;place-items:center;width:43px;height:43px;border-radius:13px;background:#e8f2fb;color:#145b93;font-size:23px}.service b{display:block;margin:15px 0 6px;font-size:15px}.service small{color:#708094;line-height:1.4}.card{background:white;border:1px solid #e1e8ef;border-radius:20px;padding:19px;margin:13px 0;box-shadow:0 6px 18px #172f4b09}.card p{color:#63778c;font-size:14px;line-height:1.5}.store{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid #edf1f5;font-weight:650}.store:first-of-type{border:0}.badge{font-size:11px;color:#226747;background:#e3f5eb;border-radius:30px;padding:5px 9px}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e1e7ef;display:flex;justify-content:center;padding:10px 6px 18px;gap:8px}.bottom button{background:none;border:0;color:#55718b;font-size:12px;padding:8px 14px}.bottom button.active{color:#155b90;font-weight:800}.back{border:0;background:none;color:#155b90;font-size:15px;padding:12px 0}.field{font-size:13px;font-weight:700;display:block;margin:13px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd9e5;border-radius:10px;font:inherit}textarea{min-height:100px}.note{font-size:12px;color:#7a8999}.alert{background:#fff3e1;padding:13px;border-radius:12px;color:#805b20;font-size:13px}.action{background:#185c92;color:white;width:100%;margin-top:15px}.success{background:#e3f5eb;padding:14px;border-radius:12px;color:#186545}.tag{display:inline-block;font-size:12px;padding:6px 10px;background:#e8f2fb;border-radius:20px;color:#215b86}</style></head><body><div style="background:#0c2039;padding:11px 17px;text-align:right"><a href="index.html" style="color:#fff;font:600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;text-decoration:none">Рабочая зона ↗</a></div><div class="app" id="app"></div><nav class="bottom" id="nav"></nav><script>const SHOPS=['Хоста','Кудепста','Блиново','Чайсовхоз'];let view='home';const KEY='mobilainisha_v74_demo';function getDb(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.items)?v:{items:[],audit:[]}}catch{return {items:[],audit:[]}}}let lastOrder='';function demoSubmit(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),db=getDb(),isRepair=view==='repair',type=isRepair?'Ремонт':'Поручение',code=isRepair?'REM':'REQ',year=new Date().getFullYear(),prefix=code+'-'+year+'-',max=db.items.reduce((n,x)=>String(x.docNo||'').startsWith(prefix)?Math.max(n,Number(x.docNo.slice(prefix.length))||0):n,0);db.counters=db.counters||{};const seq=Math.max(max,db.counters[prefix]||0)+1;db.counters[prefix]=seq;const docNo=prefix+String(seq).padStart(6,'0'),id='C'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const x={id,docNo,type,role:'Клиент',shop:f.shop,title:(isRepair?'Заявка на ремонт':'Запрос клиента')+' · '+f.shop,details:f.details,customerName:f.name,customerPhone:f.phone,at:new Date().toLocaleString('ru-RU'),status:isRepair?'Заявка клиента':'Открыто',files:[],intake:{},release:{}};db.items.unshift(x);db.notifications=db.notifications||[];db.notifications.unshift({id,shop:f.shop,at:x.at,msg:'Новая заявка клиента '+docNo});db.audit=db.audit||[];db.audit.unshift({id,role:'Клиент',at:x.at,action:'Демо-заявка создана '+docNo});localStorage.setItem(KEY,JSON.stringify(db));lastOrder=docNo;document.getElementById('app').innerHTML=page('Заявка зарегистрирована','<div class="card success"><h2>'+docNo+'</h2><p>Заявка появилась в рабочей зоне этого браузера. Скопируйте номер и проверьте статус.</p><button class="cta action" onclick="go(\'track\')">Проверить статус →</button></div><p class="alert">Демо: заявка не отправлена в реальный магазин. Не используйте настоящие персональные данные.</p>')}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const services=[['🔧','Ремонт устройства','Оставить заявку','repair'],['📱','Мой ремонт','Проверить статус','track'],['🛍️','Товары и аксессуары','Узнать об ассортименте','catalog'],['📍','Наши магазины','Выбрать удобный адрес','stores'],['💬','Обратиться к нам','Задать вопрос','contact'],['🛡️','Гарантия и поддержка','Отправить обращение','warranty']];function go(x){view=x;render();scrollTo(0,0)}function home(){return '<header class="hero"><div class="brand">MOBILAINISHA</div><h1>Ваш телефон<br>в надёжных руках</h1><p>Магазины мобильной техники и сервисные центры. Всё необходимое — в одном месте.</p><button class="cta" onclick="go(\'repair\')">Оставить заявку на ремонт →</button></header><h2 class="section">Чем можем помочь</h2><div class="grid">'+services.map(x=>'<button class="service" onclick="go(\''+x[3]+'\')"><span class="ic">'+x[0]+'</span><b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')+'</div><h2 class="section">Наши магазины</h2><section class="card"><p>Четыре магазина сети в Сочи</p>'+SHOPS.map(x=>'<div class="store">'+x+'<span class="tag">Сочи</span></div>').join('')+'<button class="cta action" onclick="go(\'stores\')">Выбрать магазин</button></section>'}function page(t,body){return '<button class="back" onclick="go(\'home\')">← На главную</button><h1>'+t+'</h1>'+body}function stores(){return page('Наши магазины','<div class="card"><p>Выберите магазин. Точные адреса и контакты добавим после подтверждения справочника.</p>'+SHOPS.map(x=>'<div class="store">'+x+'<span class="tag">Магазин и сервис</span></div>').join('')+'</div>')}function form(kind){const title={repair:'Заявка на ремонт',contact:'Обратиться к нам',warranty:'Гарантия и поддержка',catalog:'Вопрос о товаре'}[kind];return page(title,'<div class="card"><p>Опишите вопрос — форма демонстрирует будущий клиентский сценарий.</p><form id="request"><label class="field">Магазин</label><select name="shop">'+SHOPS.map(x=>'<option>'+x+'</option>').join('')+'</select><label class="field">Ваше имя</label><input name="name" required maxlength="70"><label class="field">Телефон для связи</label><input name="phone" required type="tel" placeholder="+7 …"><label class="field">Описание</label><textarea name="details" required placeholder="Что случилось или что хотите узнать?"></textarea><label class="field">Фото устройства или товара</label><input type="file" accept="image/*" multiple><p class="alert">Тестовая заявка сохраняется только в этом браузере и появится в рабочей зоне на этом же устройстве. Не вводите настоящие персональные данные.</p><button class="cta action">Создать тестовую заявку</button></form></div>')}function track(){return page('Мой ремонт','<div class="card"><p>Введите номер тестового заказа, созданного на этом устройстве.</p><label class="field">Номер заказа</label><input id="trackNo" value="'+esc(lastOrder)+'" placeholder="REM-2026-000001"><button class="cta action" onclick="checkTrack()">Проверить статус</button><div id="trackResult"></div><p class="note">Между разными телефонами данные пока не синхронизируются.</p></div>')}function checkTrack(){const v=document.getElementById('trackNo').value.trim().toUpperCase(),x=getDb().items.find(i=>i.docNo===v&&i.role==='Клиент');document.getElementById('trackResult').innerHTML=x?'<div class="success" style="margin-top:16px"><b>'+esc(x.docNo)+'</b><p>Статус: '+esc(x.status)+'</p><p>Магазин: '+esc(x.shop)+'</p></div>':'<p class="alert">Тестовый заказ не найден на этом устройстве.</p>'}function render(){document.getElementById('app').innerHTML=view==='home'?home():view==='stores'?stores():view==='track'?track():form(view);document.getElementById('nav').innerHTML=[['home','⌂ Главная'],['repair','＋ Ремонт'],['track','◷ Мой заказ'],['stores','▦ Магазины']].map(x=>'<button class="'+(view===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('');if(document.getElementById('request'))document.getElementById('request').onsubmit=demoSubmit}render();</script></body></html>
