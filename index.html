return `<div style="position:fixed;inset:0;background:#0e1526a8;z-index:50;display:flex;align-items:flex-end;justify-content:center" data-action="close"><div style="background:#f7f9fb;padding:19px 19px max(20px,env(safe-area-inset-bottom));border-radius:25px 25px 0 0;width:100%;max-width:470px;max-height:86dvh;overflow:auto" id="modal"><div class="row"><h2 class="h2" style="margin:0">${heading}</h2><button class="iconbtn" data-action="close" aria-label="Закрыть">✕</button></div><div class="banner-note">Проверочная форма. Не вводите реальные данные клиентов.</div>${name!=='notice'?`<form id="demoForm" data-type="${name}">${form}<button type="submit" class="primary full">Сохранить тестовую запись</button></form>`:form}</div></div>`;
}
function render(keepFocus=false){let focus=keepFocus&&document.activeElement&&document.activeElement.id==='search';let position=focus?document.activeElement.selectionStart:null;el.innerHTML=shell(isBiz?business():shop());if(focus){const i=el.querySelector('#search');if(i){i.focus();i.setSelectionRange(position,position)}}save();}
const msg=m=>{S.notices.unshift(m);S.notices=S.notices.slice(0,20)};
const go=p=>{if(isBiz&&p!=='dashboard'&&!(bizPages[S.role]||[]).includes(p)){S.page='dashboard'}else{S.page=p}S.overlay=null;render();window.scrollTo({top:0,behavior:'instant'});};
el.addEventListener('click',e=>{
 const b=e.target.closest('[data-page],[data-action]');if(!b)return;
 if(b.dataset.page){go(b.dataset.page);return}
 const a=b.dataset.action,v=b.dataset.value,id=b.dataset.id;
 if(a==='add'){S.cart[id]=(S.cart[id]||0)+1;if(S.cart[id]>99)S.cart[id]=99;render();return}
 if(a==='dec'){S.cart[id]=Math.max(0,(S.cart[id]||0)-1);render();return}
 if(a==='category'){S.cat=v;go('catalog');return}
 if(a==='delivery'){S.delivery=v;render();return}
 if(a==='order'){const entries=Object.entries(S.cart).filter(([id,q])=>q);if(!entries.length)return;const enough=entries.every(([id,q])=>{const g=GOODS.find(x=>x.id===id);return S.delivery==='pickup'?g.stock[S.store]>=q:g.stock.reduce((p,c)=>p+c,0)>=q});if(!enough){alert('Недостаточно товаров на выбранном складе (демо).');return;}S.orders.unshift({id:'M-'+String(1000+S.orders.length),delivery:S.delivery,store:S.store,amount:entries.reduce((n,[id,q])=>n+GOODS.find(g=>g.id===id).price*q,0)});S.cart={};msg('Создан тестовый заказ, реальные товары не резервируются.');go('orders');return;}
 if(a==='overlay'||a==='notice'){S.overlay=a==='notice'?'notice':v;render();return;}
 if(a==='close'){if(e.target.closest('#modal')&&b.id!=='modal'&&!e.target.matches('[data-action="close"]'))return;S.overlay=null;render();return;}
 if(a==='profile'){if(v==='orders')go('orders');else if(v==='stores')go('stores');else if(v==='notices'){S.overlay='notice';render()}else go('service');return;}
 if(a==='goBiz'){go(v);return;}
 if(a==='task'){const t=S.tasks.find(x=>x.id===id);if(t)t.done=!t.done;render();return}
 if(a==='part'){const p=S.parts.find(x=>x.id===id);if(p)p.status=Math.min(5,p.status+1);render();return}
 if(a==='partok'){const p=S.parts.find(x=>x.id===id);if(p)p.status=6;render();return}
 if(a==='repair'){const j=S.jobs.find(x=>x.id===id);if(j){j.status=j.status===3?0:j.status+1;msg(`Демо: статус ремонта ${j.id} изменён.`)}render();return}
 if(a==='expense'){const x=S.expenses.find(x=>x.id===id);if(x)x.checked=true;render();return}
});
el.addEventListener('input',e=>{if(e.target.id==='search'){S.search=e.target.value;render(true)}});
el.addEventListener('change',e=>{if(e.target.id==='role'){S.role=e.target.value;S.page='dashboard';render();return}if(e.target.id==='storeSel'){S.store=Number(e.target.value);render();return}if(e.target.name==='photo'){const nm=el.querySelector('#photoName');if(nm)nm.textContent=e.target.files?.[0]?.name||'Фото не выбрано';}if(e.target.dataset.photoPart){const p=S.parts.find(x=>x.id===e.target.dataset.photoPart);if(p)p.photoName=e.target.files?.[0]?.name||'';render();}});
el.addEventListener('submit',e=>{
 if(e.target.id==='chatForm'){e.preventDefault();const f=new FormData(e.target),t=String(f.get('msg')||'').trim();if(t)S.chat.push({role:ROLE[S.role],text:t});render();return}
 if(e.target.id!=='demoForm')return;e.preventDefault();let f=new FormData(e.target),kind=e.target.dataset.type;
 if(kind==='repair'){const device=String(f.get('device')||'').trim(),work=String(f.get('work')||'').trim();if(!device||!work)return;S.jobs.unshift({id:'R-'+(1002+S.jobs.length),device,work,price:Number(f.get('price')||0),status:0});msg('Зарегистрирована тестовая заявка на ремонт.');if(isBiz)S.page='repairs';else S.page='service'}
 if(kind==='part'){const name=String(f.get('name')||'').trim(),qty=Math.max(1,Number(f.get('qty'))||1);if(!name)return;S.parts.unshift({id:'Z-'+(402+S.parts.length),name,qty,status:0,defect:false});S.page='parts';msg('Добавлена тестовая заявка на запчасть.')}
 if(kind==='task'){const title=String(f.get('title')||'').trim();if(!title)return;S.tasks.unshift({id:'T-'+(103+S.tasks.length),title,store:Number(f.get('store')),done:false});S.page='tasks';msg('Создано тестовое задание.')}
 if(kind==='expense'){const name=String(f.get('name')||'').trim(),sum=Number(f.get('sum'));if(!name||!(sum>0))return;S.expenses.unshift({id:'E-'+(2+S.expenses.length),name,sum,store:Number(f.get('store')),method:String(f.get('method')),checked:false,photoName:f.get('photo')?.name||''});S.page='expenses';msg('Создана тестовая запись расхода. Фотография не загружалась на сервер.')}
 if(kind==='shift'){S.reports.unshift({store:Number(f.get('store')),actual:Number(f.get('actual')),discount:Number(f.get('discount')||0),photoName:f.get('photo')?.name||''});S.page='reports';msg('Добавлен тестовый отчёт смены.')}
 S.overlay=null;render();
});
render();
})();
</script>
<script>
(()=>{
  'use strict';
  const mode=document.body.dataset.variant==='business'?'staff':'shop';
  const app=document.getElementById('app');
  let installPrompt=null;
  window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();installPrompt=e;});
  function addSwitcher(){
    const header=app.querySelector('.top');
    if(!header || header.querySelector('.pwa-modes')) return;
    const modes=document.createElement('nav');
    modes.className='pwa-modes';
    modes.setAttribute('aria-label','Выбор режима MOBILAINISHA');
    modes.innerHTML=`<a href="./index.html" ${mode==='shop'?'aria-current="page"':''}>🛍️ Покупателям</a><a href="./staff.html" ${mode==='staff'?'aria-current="page"':''}>🧑‍💼 Сотрудникам</a>`;
    header.appendChild(modes);
    const row=document.createElement('div');
    row.className='pwa-install-row';
    row.innerHTML='<span class="pwa-status">Единое приложение · демонстрация 0.6</span><button type="button" class="pwa-install-button">↓ Как установить</button>';
    header.appendChild(row);
    if(mode==='staff'){
      const warning=document.createElement('div');warning.className='pwa-warning';
      warning.textContent='Демо-кабинет: роли не защищены входом. Не вводите реальные данные сотрудников, покупателей и продаж.';
      const slot=app.querySelector('.rolebar');
      if(slot) slot.insertAdjacentElement('afterend',warning); else header.insertAdjacentElement('afterend',warning);
    }
  }
  const observer=new MutationObserver(addSwitcher);
  observer.observe(app,{childList:true});
  addSwitcher();
  function openHelp(){
    let dlg=document.getElementById('pwa-install-help');
    if(!dlg){
      dlg=document.createElement('div');
      dlg.id='pwa-install-help';dlg.className='pwa-dialog';dlg.setAttribute('role','dialog');dlg.setAttribute('aria-modal','true');
      dlg.setAttribute('aria-label','Как установить MOBILAINISHA');
      document.body.appendChild(dlg);
      dlg.addEventListener('click',e=>{if(e.target===dlg||e.target.classList.contains('pwa-close'))dlg.hidden=true;});
    }
    dlg.hidden=false;
    const isIos=/iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    dlg.innerHTML=`<article><h2>Установка MOBILAINISHA</h2>${isIos?'<p><strong>iPhone / iPad:</strong> откройте сайт в Safari, нажмите «Поделиться» → «На экран Домой» → «Добавить».</p>':'<p><strong>Android:</strong> откройте сайт в Chrome, затем меню ⋮ → «Установить приложение» или «Добавить на главный экран».</p>'}<p><strong>Важно:</strong> приложение должно быть размещено на HTTPS-сайте. Из локального HTML-файла установка не работает.</p><p class="pwa-small">Эта версия использует только тестовые данные на текущем устройстве. Для реальной работы с заказами нужна серверная база данных и защищённые аккаунты.</p><button class="pwa-close" type="button">Понятно</button></article>`;
    dlg.querySelector('.pwa-close').focus();
  }
  document.addEventListener('click',async e=>{
    if(!e.target.closest('.pwa-install-button'))return;
    if(installPrompt){
      try{await installPrompt.prompt();installPrompt=null;}catch(_){openHelp();}
    } else openHelp();
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){const dlg=document.getElementById('pwa-install-help');if(dlg)dlg.hidden=true;}});
  if('serviceWorker' in navigator && window.isSecureContext){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body></html>
