<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOBILAINISHA · Проверка ремонта</title><style>:root{font-family:system-ui,-apple-system,Arial;color:#17253b;background:#f2f5f9}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:18px 14px 80px}h1{font-size:23px;margin:12px 0}h2{font-size:18px}p{line-height:1.5}.panel{background:white;border:1px solid #e0e6ee;border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 3px 12px #102b4510}.muted{color:#5d6d7e}.warning{background:#fff3d5;padding:12px;border-radius:12px;color:#624600}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1}button,input,select,textarea{font:inherit}button{cursor:pointer;background:#146e5a;color:white;border:0;border-radius:10px;padding:11px 14px;font-weight:600}button.secondary{background:#eaf1f5;color:#17364c}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #cdd7e0;border-radius:9px;margin-top:5px}label{display:block;font-weight:600;margin:12px 0}textarea{min-height:80px}canvas{display:block;border:1px dashed #8696a8;border-radius:9px;width:100%;height:120px;touch-action:none;background:white}.item{border:1px solid #dbe4eb;border-radius:12px;padding:12px;margin:12px 0}.pill{display:inline-block;background:#e5f2eb;border-radius:20px;padding:4px 9px;font-size:12px}small{color:#64748b}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.logo{font-weight:900;letter-spacing:1px}.hide{display:none!important}@media print{.no-print{display:none!important}body{background:white}.panel{box-shadow:none;border:0}main{max-width:none;padding:0}#app{display:none}#paper{display:block!important}.paper{font:12px Arial;color:black}.paper table{border-collapse:collapse;width:100%}.paper td,.paper th{border:1px solid #333;padding:8px;text-align:left}.paper h2{text-align:center}.paper img{max-height:60px} @page{size:A4;margin:14mm}}</style></head><body><main><div class="no-print"><div class="logo">MOBILAINISHA · СЕРВИС</div><h1>Проверка процесса ремонта</h1><p class="warning"><b>Только тестовый стенд.</b> Данные хранятся в браузере этого устройства. На другом телефоне заявки не появятся. Не вводите реальные ФИО, телефоны, IMEI и подписи. Документы ниже — тестовые образцы, не юридически действительные акты.</p><div class="tabs"><button id="clientTab">Клиент</button><button id="staffTab" class="secondary">Сотрудник / мастер</button></div></div><div id="app"></div><div id="paper" class="hide"></div></main><script>
'use strict';
const STORES=['Хоста','Кудепста','Блиново','Чайсовхоз'],KEY='mob75_repair_walkthrough_demo_v1';
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch{data=[]}
let mode='client',store=0,staffRole='seller',sigData='',lastId='';
const app=document.getElementById('app'),paper=document.getElementById('paper');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const when=t=>new Date(t).toLocaleString('ru-RU');
const status=x=>x.status==='new'?'Ожидает подтверждения приёмки':x.status==='accepted'?'Устройство принято сотрудником':'Мастер принял в работу';
const opt=()=>STORES.map((s,i)=>'<option value="'+i+'" '+(i===store?'selected':'')+'>'+s+'</option>').join('');
function draw(){document.getElementById('clientTab').className=mode==='client'?'':'secondary';document.getElementById('staffTab').className=mode==='staff'?'':'secondary';if(mode==='client')client();else staff()}
function client(){app.innerHTML='<section class="panel"><h2>1. Предварительная заявка</h2><p class="muted">Выберите магазин, в котором будете сдавать устройство.</p><form id="req"><label>Магазин<select name="store" required>'+opt()+'</select></label><label>Имя для теста<input name="name" required placeholder="Тестовый клиент" maxlength="60"></label><label>Модель телефона<input name="device" required placeholder="Тестовый смартфон" maxlength="100"></label><label>Неисправность<textarea name="fault" required maxlength="400"></textarea></label><label>Комплектность<input name="kit" placeholder="Телефон без аксессуаров" maxlength="100"></label><label>Внешнее состояние<input name="condition" placeholder="Например, царапины на корпусе" maxlength="200"></label><label>Подпись клиента (только имитация)</label><canvas id="sign" width="640" height="150"></canvas><div class="row"><button type="button" class="secondary" id="clearSig">Очистить подпись</button><button type="submit">Оформить заявку</button></div></form></section><section class="panel"><h2>2. Мои тестовые заявки</h2>'+(!data.length?'<p class="muted">Заявок ещё нет.</p>':data.slice().reverse().map(x=>'<div class="item"><b>№ '+esc(x.id)+'</b> · '+esc(STORES[x.store])+'<p>'+esc(x.device)+' — '+esc(x.fault)+'</p><span class="pill">'+status(x)+'</span><p><small>Создана: '+when(x.created)+'</small></p><button class="secondary" data-act="doc" data-id="'+esc(x.id)+'">Посмотреть документ</button></div>').join(''))+'</section>';const c=document.getElementById('sign'),ctx=c.getContext('2d');ctx.strokeStyle='#17253b';ctx.lineWidth=2.6;ctx.lineCap='round';let drawing=false,used=false;function pos(e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{drawing=true;used=true;c.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(...p)};c.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...pos(e));ctx.stroke()};c.onpointerup=()=>drawing=false;document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);used=false};document.getElementById('req').onsubmit=e=>{e.preventDefault();if(!used)return alert('Для теста нарисуйте условную подпись. Не используйте настоящую.');const f=new FormData(e.target),x={id:'TEST-'+Date.now().toString(36).toUpperCase(),store:Number(f.get('store')),name:String(f.get('name')),device:String(f.get('device')),fault:String(f.get('fault')),kit:String(f.get('kit')),condition:String(f.get('condition')),signature:c.toDataURL('image/png'),created:Date.now(),status:'new',events:[{at:Date.now(),message:'Клиент оформил предварительную заявку'}]};data.push(x);save();lastId=x.id;alert('Тестовая заявка № '+x.id+' сохранена. Теперь перейдите в кабинет сотрудника этого магазина.');draw()};app.querySelectorAll('[data-act="doc"]').forEach(b=>b.onclick=()=>showDoc(b.dataset.id))}
function staff(){app.innerHTML='<section class="panel"><h2>Кабинет сотрудника</h2><label>Мой магазин<select id="shop">'+opt()+'</select></label><label>Моя роль<select id="role"><option value="seller" '+(staffRole==='seller'?'selected':'')+'>Продавец (приёмка)</option><option value="master" '+(staffRole==='master'?'selected':'')+'>Мастер (работа)</option></select></label><p class="muted">В тесте выбор роли открыт для демонстрации. В реальном приложении роль и магазин должны определяться авторизацией.</p></section><section class="panel"><h2>Заявки магазина: '+STORES[store]+'</h2>'+(!data.filter(x=>x.store===store).length?'<p class="muted">Заявок для этого магазина нет.</p>':data.filter(x=>x.store===store).slice().reverse().map(x=>'<div class="item"><b>№ '+esc(x.id)+'</b><p>'+esc(x.device)+' · '+esc(x.fault)+'</p><span class="pill">'+status(x)+'</span><p><small>'+x.events.map(e=>esc(e.message)+' — '+when(e.at)).join('<br>')+'</small></p><div class="row"><button class="secondary" data-act="doc" data-id="'+esc(x.id)+'">Документ</button>'+(staffRole==='seller'&&x.status==='new'?'<button data-act="accept" data-id="'+esc(x.id)+'">Подтвердить приём</button>':'')+(staffRole==='master'&&x.status==='accepted'?'<button data-act="start" data-id="'+esc(x.id)+'">Принял в работу</button>':'')+'</div></div>').join(''))+'</section>';document.getElementById('shop').onchange=e=>{store=Number(e.target.value);draw()};document.getElementById('role').onchange=e=>{staffRole=e.target.value;draw()};app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const x=data.find(x=>x.id===b.dataset.id);if(!x)return;if(b.dataset.act==='doc')return showDoc(x.id);if(b.dataset.act==='accept'&&staffRole==='seller'&&x.status==='new'){if(!confirm('Подтвердить, что устройство физически получено? В реальном процессе нужна проверка устройства и подпись сотрудника.'))return;x.status='accepted';x.events.push({at:Date.now(),message:'Продавец подтвердил приём устройства (демо)'})}else if(b.dataset.act==='start'&&staffRole==='master'&&x.status==='accepted'){x.status='working';x.events.push({at:Date.now(),message:'Мастер принял устройство в работу (демо)'})}save();draw()})}
function showDoc(id){const x=data.find(x=>x.id===id);if(!x)return;paper.innerHTML='<div class="paper"><header><b>MOBILAINISHA · Сервисный центр</b><p>ИП Касумов И.К. · г. Сочи, Хоста, ул. 50 лет СССР, д. 14<br>+7 962 884 9777 · Ежедневно 09:00–20:00</p></header><h2>ПОДТВЕРЖДЕНИЕ ПРЕДВАРИТЕЛЬНОЙ ЗАЯВКИ</h2><p style="text-align:center"><b>ТЕСТ — НЕ ЯВЛЯЕТСЯ АКТОМ ФАКТИЧЕСКОЙ ПРИЁМКИ</b></p><table>'+[['Номер',x.id],['Дата и время',when(x.created)],['Магазин',STORES[x.store]],['Клиент',x.name],['Устройство',x.device],['Неисправность',x.fault],['Комплектность',x.kit],['Состояние',x.condition],['Статус',status(x)]].map(a=>'<tr><th>'+esc(a[0])+'</th><td>'+esc(a[1])+'</td></tr>').join('')+'</table><h3>Условная подпись клиента (демо)</h3><img alt="Условная тестовая подпись" src="'+x.signature+'"><p>Акт приёмки по оригинальному фирменному бланку оформляется только после фактической передачи устройства и подтверждения сотрудника.</p></div>';paper.classList.remove('hide');document.getElementById('app').classList.add('hide');let nav=document.createElement('div');nav.id='paperNav';nav.className='no-print panel';nav.innerHTML='<button id="backDoc" class="secondary">← Назад</button> <button id="printDoc">Печать / PDF</button>';paper.prepend(nav);document.getElementById('backDoc').onclick=()=>{paper.classList.add('hide');paper.innerHTML='';app.classList.remove('hide')};document.getElementById('printDoc').onclick=()=>window.print()}
document.getElementById('clientTab').onclick=()=>{mode='client';draw()};document.getElementById('staffTab').onclick=()=>{mode='staff';draw()};draw();
</script></body></html>
